  'co-pay': el => { S.co.pay = el.value; I.render(true); }
});

/* ---------- confirmation ---------- */
I.route('confirmation', {title:'Order confirmed', render: () => {
  const o = S.lastOrder || I.orders()[0]; const tt = I.orderTotals(o);
  const destTxt = o.dest.kind==='us' ? o.dest.city : (o.dest.city+', '+I.AFRICA[o.dest.cc].name);
  return `<div class="wrap" style="padding-block:20px 56px">
    <section class="confirm-hero"><span class="tick">${ico('check')}</span><div><span class="kicker left on-dark">Order ${esc(o.no)}</span><h1 style="margin-top:8px">Thank you, ${esc(S.user.first)}. Your order is placed.</h1><p style="margin-top:8px">We sent a confirmation to ${esc(S.user.email)}. ${o.pkgs.length} ${o.pkgs.length===1?'seller is':'sellers are'} packing your items now.</p></div><div class="stack" style="--g:8px"><a class="btn btn-cta" href="#track">Track your order</a><a class="btn btn-line-white" href="#home">Continue shopping</a></div></section>
    <div class="cols-2" style="margin-top:24px"><div class="stack" style="--g:14px">${o.pkgs.map((k,i)=>{ const s = SL[k.seller]; const when = k.window || (k.etaTo && +k.etaTo!==+k.eta ? fmt.md(k.eta)+' to '+fmt.md(k.etaTo) : fmt.day(k.eta)); return `<div class="panel"><div class="ph"><div class="row" style="--g:10px">${I.lettermark(s,36)}<div><b style="color:var(--navy)">Package ${i+1}: ${esc(s.name)}</b><div class="small muted">${esc(k.method)}</div></div></div><span class="status st-info">${esc(k.st)}</span></div><div class="pb stack">${I.routeHTML(s.city, destTxt, {fill:6})}<div class="row between"><span class="small muted">${k.items.map(it=>esc(P[it.id].name.split(',')[0])).join(', ')}</span><b class="small">Arrives ${esc(when)}</b></div></div></div>`; }).join('')}</div>
      <div class="stack" style="--g:14px"><div class="panel"><div class="ph"><h3>What happens next</h3></div><div class="pb"><ol class="tl">${[['Now','Sellers pack your items','Each seller gets their part of your order.'],['Within 1 day','Packages ship','You get a tracking link for each package.'],['On the way','Track live','Local packages show the driver on a map.'],['Arrival','Delivered','Rate the seller and the product.']].map((x,i)=>`<li class="${i===0?'on':''}"><span class="t">${x[0]}</span><span class="d"></span><span><b>${x[1]}</b><small>${x[2]}</small></span></li>`).join('')}</ol></div></div>
        <div class="panel"><div class="ph"><h3>Payment summary</h3></div><div class="pb stack" style="--g:8px"><div class="row between"><span>Items</span><span class="num">${fmt.usd(tt.sub)}</span></div><div class="row between"><span>Shipping</span><span class="num">${fmt.usd(tt.ship)}</span></div>${o.dest.kind==='intl'?`<div class="row between"><span>Duties and taxes (est.)</span><span class="num">${fmt.usd(tt.duty)}</span></div>`:`<div class="row between"><span>Sales tax (est.)</span><span class="num">${fmt.usd(tt.tax)}</span></div>`}<div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><b>Total</b><b class="num">${fmt.usd(tt.total)}</b></div></div></div>
        <button class="btn btn-outline" data-act="ai">${ico('spark','sm')} Ask iiB Assistant about this order</button></div></div></div>`;
}});

/* ---------- wishlist and compare ---------- */
I.route('wishlist', {title:'Wishlist', render: () => {
  const list = S.wish.map(id=>P[id]).filter(Boolean);
  return pageHead('Your wishlist', list.length ? `${list.length} saved items. Prices and delivery are for ${esc(I.destShort())}.` : '', [['Home','#home'],['Account','#account'],['Wishlist','#wishlist']], list.length?`<button class="btn btn-outline" data-act="wish-all">Add all to cart</button>`:'')
    + `<div class="wrap" style="padding-bottom:56px">${list.length ? `<div class="pgrid" style="--cols:4">${list.map(p=>I.pcard(p)).join('')}</div>` : `<div class="empty"><span class="ic">${ico('heart','lg')}</span><h3>Nothing saved yet</h3><p class="muted">Tap the heart on any product to save it here.</p><a class="btn btn-primary" href="#best">See best sellers</a></div>`}</div>`;
}});
Object.assign(window.IIB_ACTIONS, { 'wish-all': () => { S.wish.forEach(id => I.addToCart(id,1, P[id].opts ? P[id].opts[1] : undefined)); } });
I.route('compare', {title:'Compare products', render: () => {
  const list = S.compare.map(id=>P[id]).filter(Boolean);
  if(!list.length) return pageHead('Compare products','',[['Home','#home'],['Compare','#compare']]) + `<div class="wrap" style="padding-bottom:56px"><div class="empty"><span class="ic">${ico('grid','lg')}</span><h3>Nothing to compare yet</h3><p class="muted">Choose "Compare" on up to four products.</p><a class="btn btn-primary" href="#c-electronics">Browse Electronics</a></div></div>`;
  const row = (label, fn) => `<tr><th scope="row">${label}</th>${list.map(p=>`<td>${fn(p)}</td>`).join('')}</tr>`;
  return pageHead('Compare products', `Side by side, with delivery to ${esc(I.destShort())}.`, [['Home','#home'],['Compare','#compare']])
  + `<div class="wrap" style="padding-bottom:56px"><div class="tbl-wrap panel"><table class="spec cmp" style="min-width:${220+list.length*220}px">
    <tr><th scope="row">Product</th>${list.map(p=>`<td><a href="#p-${p.id}"><img src="${I.img(p)}" alt="" style="width:150px;border-radius:12px;background:var(--sweep)"></a><b style="display:block;margin-top:10px;color:var(--navy)">${esc(p.name)}</b></td>`).join('')}</tr>
    ${row('Price', p=>`<span class="price">${fmt.usd(p.price)}</span>${p.was?` <span class="was">${fmt.usd(p.was)}</span>`:''}`)}
    ${row('Rating', p=>I.stars(p.rating, p.reviews))}
    ${row('Seller', p=>`<a href="#s-${p.seller}">${esc(SL[p.seller].name)}</a><br><span class="small muted">${SL[p.seller].ontime}% on time</span>`)}
    ${row('Ships from', p=>esc(SL[p.seller].city))}
    ${row('Ships to', p=>SL[p.seller].ships.includes('Africa')?'US and Africa':'US only')}
    ${row('Weight and box', p=>`${p.lb} lb · ${p.dims.join(' x ')} in`)}
    ${row(`Delivery to ${esc(I.destShort())}`, p=>{ const q = I.quote(p.seller,[{id:p.id,q:1}]); return q.blocked?'<span style="color:var(--danger)">Not available</span>':`${esc(q.options[0].name)}<br><b>${esc(I.etaText(q.options[0]))}</b>, ${fmt.usd(q.options[0].price)}`; })}
    ${row('<span class="sr">Actions</span>', p=>`<div class="stack" style="--g:6px"><button class="btn btn-primary btn-sm" data-act="add" data-id="${p.id}">Add to cart</button><button class="btn btn-ghost btn-sm" data-act="compare-rm" data-id="${p.id}">Remove</button></div>`)}
  </table></div></div>`;
}});
Object.assign(window.IIB_ACTIONS, { 'compare-rm': (a,e,id) => { S.compare = S.compare.filter(x=>x!==id); I.save(); I.render(true); } });

/* ---------- gift cards ---------- */
I.route('gift-cards', {title:'Gift cards', render: () => {
  const g = D.content.pages.gift_cards || {}; S.gc = S.gc || 50;
  return `<div class="wrap">${I.crumbs([['Home','#home'],['Gift cards','#gift-cards']])}
  <div class="cols-2e" style="align-items:center;padding-block:16px 48px;gap:48px">
    <div class="stack" style="--g:18px"><span class="kicker left">iiB MARKET gift card</span><h1>Give them the whole marketplace.</h1><p class="muted" style="font-size:17px">${esc(g.lead || 'A digital gift card for any product from any approved seller.')}</p>
      <ul class="bullets">${(g.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="stack" style="--g:22px"><div class="gcard" role="img" aria-label="Gift card preview"><div class="row between"><img class="em" src="img/brand/emblem.webp" alt=""><span class="nm">Digital gift card</span></div><div><div class="amt num" id="gc-amt">${fmt.usd(S.gc)}</div><div class="nm" style="margin-top:6px">iiB MARKET · Your Marketplace. More Choices.</div></div></div>
    <form class="panel" data-form="gc"><div class="pb stack">
      <div class="field"><span class="label">Amount</span><div class="row" style="--g:8px">${[25,50,100,200].map(v=>`<button type="button" class="chip${S.gc===v?' on':''}" data-act="gc-amt" data-v="${v}">${fmt.usd(v)}</button>`).join('')}</div></div>
      <div class="fgrid"><div class="field"><label for="gc-to">Recipient's name</label><input id="gc-to" required placeholder="Halima"></div><div class="field"><label for="gc-em">Recipient's email</label><input id="gc-em" type="email" required placeholder="name@example.com"></div>
      <div class="field full"><label for="gc-msg">Message <span class="opt">(optional)</span></label><textarea id="gc-msg" placeholder="Happy Eid! Pick something you love."></textarea></div>
      <div class="field"><label for="gc-date">Send on</label><input id="gc-date" type="date" value="${I.TODAY.toISOString().slice(0,10)}"></div></div>
      <button class="btn btn-cta btn-lg">Add gift card to cart</button>${I.protoNote('Prototype: gift cards need a WooCommerce gift card extension (to choose).')}</div></form></div></div></div>`;
}});
Object.assign(window.IIB_ACTIONS, { 'gc-amt': (a,e,id,v) => { S.gc = parseInt(v,10); $('#gc-amt').textContent = fmt.usd(S.gc); $$('[data-act="gc-amt"]').forEach(b=>b.classList.toggle('on', b===a)); } });
Object.assign(window.IIB_FORMS, { gc: f => { I.toast(`${ico('gift')} ${fmt.usd(S.gc)} gift card for ${esc($('#gc-to').value)} is ready. (Prototype: nothing was charged.)`); f.reset(); } });
})();

</script>
<script>
/* iiB MARKET prototype: customer account pages, orders and tracking (local fleet map and carrier timelines). */
(function(){
'use strict';
const I = window.IIB, S = I.S, esc = I.esc, fmt = I.fmt, ico = I.ico, $ = I.$;
const P = I.PROD, SL = I.SELL;

const destText = d => d.kind==='us' ? `${d.city} ${d.zip}` : `${d.city}, ${I.AFRICA[d.cc].name}`;
const stCls = st => st==='Delivered' ? 'st-ok' : st==='Out for delivery' ? 'st-warn' : st==='Cancelled' ? 'st-mute' : 'st-info';
const etaOf = k => k.window || (k.etaTo && +k.etaTo!==+k.eta ? `${fmt.md(k.eta)} to ${fmt.md(k.etaTo)}` : fmt.day(k.eta));
const findOrder = no => I.orders().find(o=>o.no===no) || I.orders()[0];

/* ---------- account shell ---------- */
const NAV = [['account','Overview','home'],['orders','Orders','pkg'],['track','Track a package','map'],['addresses','Addresses','pin'],['wishlist','Wishlist','heart'],['profile','Account details','user'],['downloads','Downloads','download'],['support-request','Support','help']];
function acct(active, title, body, lead){
  return `<div class="wrap">${I.crumbs([['Home','#home'],['Your account','#account']].concat(active==='account'?[]:[[title.replace(/<[^>]+>/g,''),'#'+active]]))}
  <div class="acct"><nav class="side-nav" aria-label="Account"><div class="who"><span class="avatar" style="--h:214">${esc(S.user.first[0]+S.user.last[0])}</span><div><b style="color:var(--navy)">${esc(S.user.first)} ${esc(S.user.last)}</b><div class="micro muted">${I.sampleTag('Sample account')}</div></div></div>
    ${NAV.map(([r,t,ic])=>`<a href="#${r}" class="${r===active?'on':''}" ${r===active?'aria-current="page"':''}>${ico(ic)} ${t}</a>`).join('')}<a href="#login">${ico('logout')} Sign out</a></nav>
  <div class="stack" style="--g:20px;min-width:0"><div><h1 style="font-size:clamp(26px,2.6vw,34px)">${title}</h1>${lead?`<p class="muted" style="margin-top:6px">${lead}</p>`:''}</div>${body}</div></div></div>`;
}
function orderCard(o){
  const t = I.orderTotals(o);
  return `<article class="panel"><div class="ph"><div class="row" style="--g:22px"><div><div class="micro muted">Order</div><b style="color:var(--navy)">${esc(o.no)}</b></div><div><div class="micro muted">Placed</div><b>${fmt.day(o.placed)}</b></div><div><div class="micro muted">Total</div><b class="num">${fmt.usd(t.total)}</b></div><div><div class="micro muted">Ship to</div><b>${esc(destText(o.dest))}</b>${o.gift?' <span class="badge badge-info">Gift</span>':''}</div></div>
    <div class="row" style="--g:8px"><button class="btn btn-outline btn-sm" data-act="view-order" data-v="${o.no}">Order details</button><button class="btn btn-primary btn-sm" data-act="track-order" data-v="${o.no}">Track</button></div></div>
    <div class="pb stack" style="--g:12px">${o.pkgs.map(k=>`<div class="row between" style="--g:14px"><div class="row" style="--g:12px;min-width:0;flex-wrap:nowrap">${k.items.slice(0,2).map(it=>`<img src="${I.img(P[it.id])}" alt="" style="width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--sweep);flex:none">`).join('')}<div style="min-width:0"><b class="small" style="color:var(--ink)">${esc(k.items.map(it=>P[it.id].name.split(',')[0]).join(', '))}</b><div class="micro muted">${esc(SL[k.seller].name)} · ${esc(k.method)}</div></div></div>
      <div style="text-align:right"><span class="status ${stCls(k.st)}">${esc(k.st)}</span><div class="micro muted">${k.st==='Delivered'?'Delivered '+fmt.md(k.eta):k.cancelled?'Refund issued':'Arrives '+esc(etaOf(k))}</div></div></div>`).join('')}</div></article>`;
}
Object.assign(window.IIB_ACTIONS, {
  'view-order': (a,e,id,v) => { S.viewOrder = v; I.go('order'); },
  'track-order': (a,e,id,v) => { S.trackNo = v; S.trackPkg = parseInt(a.dataset.p||'0',10); I.go('track'); }
});

I.route('account', {title:'Your account', render: () => {
  const os = I.orders(); const inTransit = os.reduce((n,o)=>n+o.pkgs.filter(k=>!['Delivered','Cancelled'].includes(k.st)).length,0);
  const tile = (icon, n, label, href) => `<a class="kpi" href="${href}" style="text-decoration:none"><small>${ico(icon,'sm')} ${label}</small><b class="num">${n}</b></a>`;
  return acct('account', `Hello, ${esc(S.user.first)}`, `
    <div class="kpis">${tile('pkg', inTransit, 'Packages on the way', '#track')}${tile('bag', os.length, 'Orders', '#orders')}${tile('heart', S.wish.length, 'Wishlist', '#wishlist')}${tile('follow', S.follow.length, 'Stores you follow', '#stores')}</div>
    <div class="cols-2"><div class="stack" style="--g:14px"><div class="row between"><h2 style="font-size:22px">Recent orders</h2><a class="more" href="#orders">All orders ${ico('arrow','sm')}</a></div>${os.slice(0,2).map(orderCard).join('')}</div>
    <div class="stack" style="--g:14px"><div class="panel" style="background:var(--navy);border-color:var(--navy);color:#fff"><div class="pb stack"><span class="row" style="--g:10px">${ico('spark')}<b>iiB Assistant</b></span><p style="color:var(--on-navy-2)" class="small">Ask where a package is, change a delivery address or start a return in plain words.</p><button class="btn btn-cta" data-act="ai">Ask iiB Assistant</button></div></div>
      <div class="panel"><div class="ph"><h3>Saved addresses</h3><a class="more" href="#addresses">Manage</a></div><div class="pb stack" style="--g:10px">${I.ADDR.map(a=>`<div class="row" style="--g:10px;flex-wrap:nowrap">${ico(a.dest.kind==='intl'?'globe':'pin')}<span class="small"><b>${esc(a.label)}</b><br><span class="muted">${esc(a.line)}</span></span></div>`).join('')}</div></div>
      <div class="panel"><div class="ph"><h3>Support</h3></div><div class="pb stack" style="--g:8px"><a href="#support-request">Open a support request</a><a href="#start-return">Start a return</a><a href="#damaged">Report a damaged or missing item</a><a href="#help">Help Center</a></div></div></div></div>`, 'Your orders, packages and saved details in one place.');
}});

I.route('orders', {title:'Your orders', render: () => {
  const f = S.ordFilter || 'all'; const os = I.orders();
  const match = o => f==='all' || (f==='transit' && o.pkgs.some(k=>!['Delivered','Cancelled'].includes(k.st))) || (f==='delivered' && o.pkgs.every(k=>k.st==='Delivered')) || (f==='cancelled' && o.pkgs.every(k=>k.st==='Cancelled'));
  const list = os.filter(match);
  return acct('orders','Your orders', `<div class="seg" role="group" aria-label="Filter orders">${[['all','All'],['transit','On the way'],['delivered','Delivered'],['cancelled','Cancelled']].map(([k,t])=>`<button aria-pressed="${f===k}" data-act="ord-filter" data-v="${k}">${t}</button>`).join('')}</div>
    <div class="stack" style="--g:14px">${list.length?list.map(orderCard).join(''):`<div class="empty"><span class="ic">${ico('pkg','lg')}</span><h3>No orders here</h3><p class="muted">Try another filter.</p></div>`}</div>`, 'Each order can have several packages, one for each seller.');
}});
Object.assign(window.IIB_ACTIONS, { 'ord-filter': (a,e,id,v) => { S.ordFilter = v; I.render(true); } });

I.route('order', {title:'Order details', render: () => {
  const o = findOrder(S.viewOrder); const t = I.orderTotals(o);
  return acct('orders', `Order ${esc(o.no)}`, `
    <div class="row" style="--g:10px"><span class="badge badge-soft">Placed ${fmt.long(o.placed)}</span><span class="badge badge-soft">${o.pkgs.length} ${o.pkgs.length===1?'package':'packages'}</span>${o.gift?'<span class="badge badge-info">Gift to family</span>':''}</div>
    <div class="cols-2"><div class="stack" style="--g:14px">${o.pkgs.map((k,i)=>{ const s = SL[k.seller]; const fill = [0,8,45,80,100][k.step]||0; return `<section class="panel"><div class="ph"><div class="row" style="--g:10px">${I.lettermark(s,36)}<div><b style="color:var(--navy)">Package ${i+1}: ${esc(s.name)}</b><div class="micro muted">${esc(k.method)}${k.tn?` · ${esc(k.tn)}`:''}</div></div></div><span class="status ${stCls(k.st)}">${esc(k.st)}</span></div>
      <div class="pb stack">${k.cancelled?`<div class="callout">${ico('info')}<span>Cancelled before shipping. A refund of ${fmt.usd(k.items.reduce((s2,it)=>s2+P[it.id].price*it.q,0)+k.ship)} went back to your payment method.</span></div>`:I.routeHTML(s.city, destText(o.dest), {fill, van: k.local?'van':(o.dest.kind==='intl'?'plane':'truck')})}
        ${k.items.map(it=>{ const p = P[it.id]; return `<div class="row" style="--g:12px;flex-wrap:nowrap"><img src="${I.img(p)}" alt="" style="width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sweep);flex:none"><div class="grow"><a href="#p-${p.id}"><b class="small">${esc(p.name)}</b></a><div class="micro muted">Qty ${it.q}${it.opt?' · Size '+esc(it.opt):''}</div></div><b class="num small">${fmt.usd(p.price*it.q)}</b></div>`; }).join('')}
        <div class="row" style="--g:8px">${k.cancelled?'':`<button class="btn btn-primary btn-sm" data-act="track-order" data-v="${o.no}" data-p="${i}">Track package</button>`}${k.st==='Delivered'?`<a class="btn btn-outline btn-sm" href="#start-return">Return items</a><button class="btn btn-ghost btn-sm" data-act="proto" data-msg="In the live site this opens a review form for the product and the seller.">Review</button>`:''}${k.st==='Order placed'?`<button class="btn btn-ghost btn-sm" data-act="cancel-pkg" data-v="${o.no}" data-p="${i}">Cancel this package</button>`:''}<button class="btn btn-ghost btn-sm" data-act="proto" data-msg="Messages go to the seller through Store Support (Dokan Pro).">Contact seller</button></div></div></section>`; }).join('')}</div>
    <div class="stack" style="--g:14px"><div class="panel"><div class="ph"><h3>Payment</h3></div><div class="pb stack" style="--g:8px"><div class="row between"><span>Items</span><span class="num">${fmt.usd(t.sub)}</span></div><div class="row between"><span>Shipping</span><span class="num">${fmt.usd(t.ship)}</span></div>${o.dest.kind==='intl'?`<div class="row between"><span>Duties and taxes (est.)</span><span class="num">${fmt.usd(t.duty)}</span></div>`:`<div class="row between"><span>Sales tax (est.)</span><span class="num">${fmt.usd(t.tax)}</span></div>`}<div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><b>Total</b><b class="num">${fmt.usd(t.total)}</b></div><span class="micro muted">Paid with Visa ending 4242 (sample)</span></div></div>
      <div class="panel"><div class="ph"><h3>Delivery address</h3></div><div class="pb small">${esc(o.to)}</div></div>
      <button class="btn btn-outline" data-act="proto" data-msg="In the live site this downloads a PDF invoice for each seller's part of the order.">${ico('download','sm')} Download invoices</button>
      <button class="btn btn-ghost" data-act="ai">${ico('spark','sm')} Ask iiB Assistant about this order</button></div></div>`, `Shipping to ${esc(destText(o.dest))}.`);
}});
Object.assign(window.IIB_ACTIONS, {
  'cancel-pkg': a => { const o = findOrder(a.dataset.v); const k = o.pkgs[parseInt(a.dataset.p,10)]; k.st='Cancelled'; k.cancelled=true; k.step=0; k.events=[[I.TODAY,'Cancelled before shipping','Refund issued to the original payment method']]; I.render(true); I.toast('Package cancelled. The refund goes back to your payment method.'); }
});

/* ---------- tracking ---------- */
function cityMap(prog){
  const route = 'M90,300 L90,240 L210,240 L210,170 L330,170 L330,110 L470,110 L470,70 L540,70';
  const pt = Math.max(0, Math.min(1, prog/100));
  return `<svg viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Live map: the van is on its way from the iiB hub to your address">
    <rect width="600" height="360" fill="#E9EEF4"/>
    <g fill="#DCE9D9"><rect x="380" y="200" width="120" height="80" rx="14"/><rect x="40" y="40" width="110" height="70" rx="14"/><circle cx="270" cy="300" r="34"/></g>
    <path d="M0,150 C80,130 120,210 200,200 C280,190 300,120 360,140 C430,160 470,250 600,230" fill="none" stroke="#BFD6EE" stroke-width="26" stroke-linecap="round"/>
    <g stroke="#FFFFFF" stroke-width="9" fill="none">${[40,110,170,240,300].map(y=>`<path d="M0,${y} H600"/>`).join('')}${[90,210,330,470,540].map(x=>`<path d="M${x},0 V360"/>`).join('')}</g>

function placeVan(){
  document.querySelectorAll('.map svg').forEach(svg => {
    const path = svg.querySelector('#rt'), van = svg.querySelector('#van'); if(!path || !van || !path.getTotalLength) return;
    const pt = parseFloat(van.dataset.pt||'0'); const L = path.getTotalLength(); const p = path.getPointAtLength(L*pt);
    van.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
  });
}

function chartSVG(){
  const vals = Array.from({length:30},(_,i)=> 180 + Math.round(70*Math.sin(i/3.2) + 40*Math.cos(i/1.7) + i*7));

  const total = vals.reduce((a,b)=>a+b,0);
  // value labels sit outside the stretched SVG (preserveAspectRatio none squashed text on phones), one per gridline
  const ylab = [4,3,2,1,0].map((k,i)=>`<span style="top:${i*25}%">$${k*step}</span>`).join('');
  return {svg:`<div class="chart-box"><div class="ylab" aria-hidden="true">${ylab}</div><div class="plot"><svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily sales for the last 30 days, from ${fmt.usd(vals[0])} to ${fmt.usd(vals[29])}"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0867C9" stop-opacity=".22"/><stop offset="1" stop-color="#0867C9" stop-opacity="0"/></linearGradient></defs>

    <circle cx="${pts[29][0]}" cy="${pts[29][1]}" r="5" fill="#FF9818" stroke="#fff" stroke-width="2"/>
    </svg><div class="xlab" aria-hidden="true"><span>${fmt.md(I.rel(-29))}</span><span>Today</span></div></div></div>`, total};
}

  const list = D.sellers.filter(s => (f==='all' || (f==='africa' && s.ships.includes('Africa')) || (f==='local' && s.local)) && (!q || s.name.toLowerCase().includes(q) || DP[s.dept].name.toLowerCase().includes(q)));
  return I.pageHead('All sellers', `${D.sellers.length} approved stores. Every seller is reviewed by hand before they can sell.`, [['Home','#home'],['Sellers','#stores']])
  + `<div class="wrap" style="padding-bottom:56px"><div class="row between" style="margin-bottom:18px;--g:12px"><div class="seg" role="group" aria-label="Filter stores">${[['all','All stores'],['africa','Ship to Africa'],['local','iiB Local']].map(([k,t])=>`<button aria-pressed="${f===k}" data-act="st-filter" data-v="${k}">${t}</button>`).join('')}</div><form data-form="st-search" class="row" style="--g:8px"><label class="sr" for="stq">Search stores</label><input id="stq" class="input" placeholder="Search stores" value="${esc(S.stQuery||'')}" style="min-height:42px;max-width:260px"><button class="btn btn-outline btn-sm">Search</button></form></div>
    ${list.length?`<div class="sgrid">${list.map(I.scard).join('')}</div>`:`<div class="empty"><span class="ic">${ico('store','lg')}</span><h3>No stores match</h3><button class="btn btn-primary" data-act="st-filter" data-v="all">Show all stores</button></div>`}
    <div class="callout" style="margin-top:24px">${ico('shield')}<span><b>What "Approved seller" means:</b> the iiB team checked the seller's identity and business details, and their products follow the listing standards. Each store also shows its on-time shipping rate and reply time. <a href="#blog-what-approved-seller-means">Learn more</a></span></div></div>`;
}});
Object.assign(window.IIB_ACTIONS, { 'st-filter': (a,e,id,v) => { S.stFilter = v; S.stQuery = ''; I.render(true); } });
Object.assign(window.IIB_FORMS, { 'st-search': () => { S.stQuery = $('#stq').value.trim(); I.render(true); } });

const ABOUT = {lakeview:'Headphones, laptops and phones, tested before they ship.', urban:'Everyday denim, linen and canvas basics, made to last.', kente:'Wax-print fabrics, head wraps and shirts, cut and packed in Minneapolis.', amani:'Cookware and tableware for kitchens that get used every day.', glow:'Skin and hair care with simple ingredients, made in small batches.', carepoint:'Home health monitors and household basics.', littlesteps:'Strollers, carriers and wooden toys for little ones.', baraka:'Coffee, rice, honey and spices, packed fresh to order.', peak:'Fitness and outdoor gear for home workouts and weekends outside.', ironside:'Power tools, hand tools and car electronics.', lumen:'Gold-plated jewelry and steel watches, polished by hand.', paperplay:'Notebooks, desk lamps, chairs and games for work and play.'};
I.route('s-', {title: id => SL[id] ? SL[id].name : 'Store', render: id => {
  const s = SL[id]; if(!s) return I.ROUTES['not-found'].render();
  const items = D.products.filter(p=>p.seller===id); const tab = (S.storeTab && S.storeTabFor===id) ? S.storeTab : 'products';
  return `<div class="wrap">${I.crumbs([['Home','#home'],['Sellers','#stores'],[s.name,'#s-'+id]])}
  <div class="store-hero"><img src="${I.storeImg(s)}" alt=""></div>
  <div class="store-head">${I.lettermark(s,104)}<div class="nm"><h1>${esc(s.name)}</h1></div><div class="acts"><button class="btn btn-white" data-act="follow" data-id="${s.id}">${S.follow.includes(s.id)?'Following':'Follow'}</button><button class="btn btn-primary" data-act="proto" data-msg="Messages go to the seller through Dokan Store Support. Replies come by email.">${ico('chat','sm')} Contact seller</button></div></div>
  <div class="store-meta"><span class="approved">${ico('checkc')} Approved seller</span>${I.stars(s.rating, s.ratings)}<span>${esc(s.city)}</span><span>Ships to ${s.ships.includes('Africa')?'the US and Africa':'the US'}</span>${s.local?`<span class="badge badge-local">${ico('van','sm')} iiB Local</span>`:''}<span>${s.ontime}% on-time shipping</span><span>Replies ${esc(s.reply)}</span><span>Selling since ${esc(s.since)}</span></div>
  <div class="tabs" role="tablist" aria-label="Store" style="margin-top:20px">${[['products',`Products (${items.length})`],['about','About'],['reviews','Reviews'],['policies','Shipping and returns']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" data-act="store-tab" data-id="${id}" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="tabpanel" style="padding-bottom:56px">${tab==='products' ? `<div class="pgrid" style="--cols:4">${items.map(p=>I.pcard(p)).join('')}</div>`
    : tab==='about' ? `<div class="cols-2"><div class="prose"><h2 style="margin-top:0">About ${esc(s.name)}</h2><p>${esc(ABOUT[id]||'')}</p><p>${esc(s.name)} is an independent store in ${esc(s.city)}. It joined iiB MARKET in ${esc(s.since)} and ships every order from its own shelves${s.local?', with same-day iiB Local Delivery for Twin Cities addresses':''}.</p></div><div class="panel"><div class="pb"><dl class="kv"><dt>Main department</dt><dd>${esc(DP[s.dept].name)}</dd><dt>Ships from</dt><dd>${esc(s.city)}</dd><dt>Ships to</dt><dd>${s.ships.includes('Africa')?'United States and Africa':'United States'}</dd><dt>On time</dt><dd>${s.ontime}%</dd><dt>Followers</dt><dd>${fmt.num(Math.round(s.ratings*0.6))}</dd></dl></div></div></div>`
    : tab==='reviews' ? `<div class="stack" style="--g:12px">${I.sampleTag('Sample reviews for the prototype')}${[['Grace N.',5,'Well packed and on time. I will order again.'],['David O.',5,'The seller answered quickly and the tracking was clear.'],['Fatima A.',4,'Good quality. Delivery took one day longer than the first estimate.']].map(r=>`<div class="panel"><div class="pb stack" style="--g:6px"><b>${esc(r[0])}</b>${I.stars(r[1])}<p class="muted">${esc(r[2])}</p></div></div>`).join('')}</div>`
    : `<div class="cols-2e"><div class="panel"><div class="ph"><h3>Shipping</h3></div><div class="pb stack small"><p>Orders ship within 1 business day from ${esc(s.city)}. Prices are worked out from your address and the package's weight and size, and shown before you pay.</p>${I.routeHTML(s.city, I.destLabel(), {})}</div></div><div class="panel"><div class="ph"><h3>Returns</h3></div><div class="pb small stack"><p>Returns within 30 days of delivery, in the original packaging. ${esc(s.name)} sends a prepaid label (draft policy, to confirm).</p><a href="#returns">Read the returns policy</a></div></div></div>`}</div></div>`;
}});
Object.assign(window.IIB_ACTIONS, { 'store-tab': (a,e,id,v) => { S.storeTab = v; S.storeTabFor = id; I.render(true); } });

I.route('featured-sellers', {title:'Featured sellers', render: () => {
  const feat = [['kente','Wax prints, cut and packed in Minneapolis','Head wraps and shirts in bold African prints, shipped across the US and to Africa.'],['baraka','Spices, coffee and staples, packed to order','A Columbus grocery with berbere, basmati, raw honey and fresh-roasted coffee.'],['lakeview','Tech tested before it ships','Headphones, laptops and phones with same-day iiB Local Delivery in the Twin Cities.'],['amani','Cookware for kitchens that get used','Cast iron, stoneware and small appliances from Saint Paul.']];
  return I.pageHead('Featured sellers', 'Stores our team picked this month for their products, on-time shipping and service.', [['Home','#home'],['Featured sellers','#featured-sellers']])
  + `<div class="wrap stack" style="--g:28px;padding-bottom:56px">${feat.map(([id,h,p],i)=>{ const s = SL[id]; return `<section class="sellband" style="--band:${i%2?'var(--navy)':'var(--navy-950)'};min-height:320px"><div class="t"><div class="row" style="--g:12px">${I.lettermark(s,56)}<div><b style="color:#fff;font-size:18px">${esc(s.name)}</b><div class="small" style="color:var(--on-navy-2)">${esc(s.city)} · ${s.rating.toFixed(1)} stars · ${s.ontime}% on time</div></div></div><h2>${esc(h)}</h2><p>${esc(p)}</p><div class="row" style="--g:8px">${D.products.filter(x=>x.seller===id).slice(0,4).map(x=>`<a href="#p-${x.id}" aria-label="${esc(x.name)}"><img src="${I.img(x)}" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--sweep)"></a>`).join('')}</div><div class="row"><a class="btn btn-cta" href="#s-${id}">Visit store</a></div></div><div class="im"><img src="${I.storeImg(s)}" alt="" loading="lazy"></div></section>`; }).join('')}</div>`;
}});
})();

</script>
<script>
/* iiB MARKET prototype: information, help, company and policy pages. Sample data only; nothing leaves the browser. */
(function(){
'use strict';
const I = window.IIB;
const {D, $, $$, esc: E, fmt, ico} = I;
const PG = D.content.pages || {};
const POL = D.content.policies || {};
const UPDATED = D.content.updated, DRAFT = D.content.draft_note;
const HOME = ['Home', '#home'];

/* ---------- small builders ---------- */
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
const pct = n => Math.round(n * 100) + '%';
const short = name => String(name).split(',')[0];

function head(trail, title, lead, actions){
  return `${I.crumbs(trail)}<div class="phead"><div><h1 tabindex="-1">${E(title)}</h1>${lead ? `<p>${E(lead)}</p>` : ''}</div>${actions ? `<div class="row">${actions}</div>` : ''}</div>`;
}
const page = (trail, title, lead, body, actions) => `<div class="wrap">${head(trail, title, lead, actions)}${body}</div>`;
function blk(title, inner, lead, more){
  return `<section class="sec"><div class="sec-h"><div><h2>${E(title)}</h2>${lead ? `<p class="lead">${E(lead)}</p>` : ''}</div>${more || ''}</div>${inner}</section>`;
}
const faqHTML = items => `<div class="faq">${items.map(f => `<details><summary>${E(f.q)}</summary><p>${E(f.a)}</p></details>`).join('')}</div>`;
const checks = list => `<ul class="inf-list">${list.map(t => `<li>${ico('checkc')}<span>${E(t)}</span></li>`).join('')}</ul>`;
const stepsHTML = items => `<div class="steps">${items.map(s => `<div class="step"><h3>${E(s.h)}</h3><p>${E(s.p)}</p></div>`).join('')}</div>`;
function cards(items, cls, icons){
  return `<div class="${cls}">${items.map((it, i) => `<div class="panel"><div class="pb stack" style="--g:8px">${icons ? `<span class="inf-ic">${ico(icons[i % icons.length])}</span>` : ''}<h3>${E(it.h)}</h3><p class="muted">${E(it.p)}</p></div></div>`).join('')}</div>`;
}
const fig = (src, title, text, alt) => `<figure class="inf-fig"><img src="${E(src)}" alt="${E(alt || title)}" loading="lazy"><figcaption><b>${E(title)}</b>${E(text)}</figcaption></figure>`;
function tocHTML(items){
  return `<nav class="toc" aria-label="On this page"><b>On this page</b>${items.map(it => `<a href="#" data-act="inf-scroll" data-id="${E(it.id)}">${E(it.label)}</a>`).join('')}</nav>`;
}

/* form pieces: every control has a label; submit shows a success state in the page */
function field(id, label, control, o){
  o = o || {};
  return `<div class="field${o.full ? ' full' : ''}"><label for="${id}">${E(label)}${o.opt ? ' <span class="opt">(optional)</span>' : ''}</label>${control}${o.help ? `<span class="help">${E(o.help)}</span>` : ''}</div>`;
}
const inp = (id, type, o) => { o = o || {}; return `<input id="${id}" name="${id}" type="${type}"${o.req ? ' required' : ''}${o.ph ? ` placeholder="${E(o.ph)}"` : ''}${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.extra ? ' ' + o.extra : ''}>`; };
const sel = (id, opts, extra) => `<select id="${id}" name="${id}"${extra ? ' ' + extra : ''}>${opts.map(o => `<option value="${E(o.v)}"${o.sel ? ' selected' : ''}>${E(o.t)}</option>`).join('')}</select>`;
const area = (id, o) => { o = o || {}; return `<textarea id="${id}" name="${id}"${o.req ? ' required' : ''}${o.ph ? ` placeholder="${E(o.ph)}"` : ''} rows="${o.rows || 5}"></textarea>`; };
function formHTML(title, text, fields, btn, o){
  o = o || {};
  return `<form class="stack" style="--g:16px" data-form="inf-done" data-title="${E(title)}" data-text="${E(text)}"${o.close ? ' data-close="1"' : ''}>${fields}<div class="stack" style="--g:10px"><div class="row"><button class="btn ${o.cls || 'btn-cta'} btn-lg" type="submit">${E(btn)}</button></div>${I.protoNote()}</div></form>`;
}
const SENT = 'Prototype: nothing was sent or stored outside this browser tab.';

/* tabs */
function tabsHTML(group, tabs){
  return `<div class="tabs" role="tablist" data-tabs="${group}">${tabs.map((t, i) => `<button type="button" role="tab" id="inf-t-${group}-${t.k}" aria-controls="inf-p-${group}-${t.k}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-act="inf-tab" data-id="${group}" data-v="${t.k}">${E(t.label)}</button>`).join('')}</div>`
    + tabs.map((t, i) => `<div class="tabpanel" role="tabpanel" id="inf-p-${group}-${t.k}" aria-labelledby="inf-t-${group}-${t.k}"${i ? ' hidden' : ''}>${t.html}</div>`).join('');
}

/* ---------- shared policy page (also used by returns) ---------- */
function policyPage(key, o){
  o = o || {};
  const pol = POL[key];
  const ids = pol.sections.map((s, i) => `sec-${i + 1}-${slug(s.h)}`);
  const toc = tocHTML(pol.sections.map((s, i) => ({id: ids[i], label: s.h})));
  const prose = pol.sections.map((s, i) => `<h2 id="${ids[i]}">${E(s.h)}</h2>${s.p.map(t => `<p>${E(t)}</p>`).join('')}`).join('');
  const when = fmt.full(new Date(UPDATED + 'T12:00:00'));
  const body = `<div class="doc">${toc}<div class="stack" style="--g:18px"><div class="draft-banner">${ico('alert')}<span>${E(DRAFT)}</span></div><p class="small muted">Last updated: ${E(when)}</p>${o.before || ''}<div class="prose">${prose}</div>${o.after || ''}</div></div>`;
  return `<div class="wrap">${head(o.trail || [HOME, [pol.title]], pol.title, pol.summary, o.actions)}${body}</div>`;
}

/* ---------- 1. shipping ---------- */
function lane(cls, icon, name, sub, from, to, when, whenSub, cost, costSub){
  return `<div class="lane ${cls}"><span class="ic">${ico(icon)}</span><div class="m"><b>${E(name)}</b><small>${E(sub)}</small></div>${I.routeHTML(from, to, {cities: false, label: `From ${from} to ${to}`})}<div class="when">${E(when)}<small>${E(whenSub)}</small></div><div class="cost">${E(cost)}<small>${E(costSub)}</small></div></div>`;
}
function lanesHTML(){
  const w = {bill: 1, actual: 1, dim: 0};
  const mpls = {kind: 'us', zip: '55407', city: 'Minneapolis, MN'};
  const local = I.quoteFor(I.SELL.lakeview, w, mpls).find(o => o.kind === 'local');
  const ups = I.quoteFor(I.SELL.urban, w, mpls).find(o => o.id === 'ups');
  const africa = I.quoteFor(I.SELL.urban, w, {kind: 'intl', cc: 'KE', city: 'Nairobi'});
  const cheap = africa.slice().sort((a, b) => a.price - b.price)[0];
  const sampleNote = 'sample, 1 lb package';
  return `<div class="lanes">`
    + lane('local', 'van', 'iiB Local Delivery', 'Twin Cities only, live driver map', 'Seller, Twin Cities', 'Your door', local.window, 'Our own drivers', fmt.usd(local.price), sampleNote)
    + lane('', 'truck', 'UPS or FedEx across the US', 'Carrier tracking on every package', 'Seller, anywhere in the US', 'Your door', I.etaText(ups), 'UPS Ground sample', fmt.usd(ups.price), sampleNote)
    + lane('intl', 'plane', 'FedEx or UPS to Africa', 'Duties and taxes may apply', 'Seller, United States', 'Nairobi, Kenya (sample)', I.etaText(cheap), cheap.name, fmt.usd(cheap.price), sampleNote)
    + `</div>`;
}
function calcFields(){
  const f = (k, label, v) => field('inf-c-' + k, label, `<input id="inf-c-${k}" type="number" inputmode="decimal" min="0" step="any" value="${v}" data-in="inf-calc" data-k="${k}">`);
  return `<div class="fgrid" style="--fc:2">${f('w', 'Actual weight (lb)', 3)}${f('l', 'Length (in)', 14)}${f('wd', 'Width (in)', 10)}${f('h', 'Height (in)', 8)}</div>`;
}
function calcOut(w, l, wd, h){
  const dim = l * wd * h / 139, bill = Math.max(w, dim);
  const why = !w && !dim ? 'Enter a weight and the box size.' : (dim > w ? 'The box is large for its weight, so the size sets the price.' : 'The package is heavy for its size, so the actual weight sets the price.');
  return `<div class="inf-stat"><div><b>${w.toFixed(1)} lb</b><span>Actual weight</span></div><div><b>${dim.toFixed(1)} lb</b><span>Dimensional weight</span></div><div class="on"><b>${bill.toFixed(1)} lb</b><span>Billable weight</span></div></div><p class="small muted" style="margin-top:12px">${E(why)} Prototype prices round up to the next whole pound.</p>`;
}
function dutyTable(){
  const rows = Object.keys(D.africa).map(cc => {
    const t = D.duty[cc] || {}, def = t.default != null ? t.default : 0.2, hasCap = t.fashion != null;
    return `<tr><td class="main" data-l="Country"><b>${E(D.africa[cc].name)}</b> <span class="muted small">${E(D.africa[cc].city)}</span></td><td class="r" data-l="Clothing and fashion">${pct(hasCap ? t.fashion : def)}${hasCap ? ' <span class="badge badge-info">ceiling</span>' : ''}</td><td class="r" data-l="Most other items">${pct(def)}</td></tr>`;
  }).join('');
  return `<div class="panel"><div class="ph"><b>Sample duty and tax rates</b>${I.sampleTag('Sample rates')}</div><div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>Country</th><th class="r">Clothing and fashion</th><th class="r">Most other items</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pb"><p class="small muted">Clothing ceilings are shown for Kenya, Ghana, Nigeria and South Africa. Every other rate is a sample for the prototype. Checkout shows an estimate before you pay.</p></div></div>`;
}
function renderShipping(){
  const pol = POL.shipping;
  const prose = pol.sections.map(s => `<h3>${E(s.h)}</h3>${s.p.map(t => `<p>${E(t)}</p>`).join('')}`).join('');
  const explain = `<div class="cols-2"><div class="stack" style="--g:14px"><p class="prose" style="max-width:none">Shipping is worked out from where the seller ships, your address, and each package's weight and size. Carriers price by the larger of two weights: the actual weight, and the dimensional weight, which is length x width x height (in inches) divided by 139. Try your own box.</p>${calcFields()}</div><div class="panel soft"><div class="pb" id="inf-calc-out">${calcOut(3, 14, 10, 8)}</div></div></div><div class="row" style="margin-top:16px"><a class="btn btn-outline" href="#blog-how-shipping-cost-is-calculated">Read the guide ${ico('arrow', 'sm')}</a><a class="btn btn-ghost" href="#shipping-rates">Open the full calculator</a></div>`;
  const body = blk('Three ways your package travels', lanesHTML(), 'Sample prices for a 1 lb package. Your own price depends on the seller, your address and the package.')
    + blk('How the price is worked out', explain)
    + blk('Duties and taxes on orders to Africa', dutyTable(), null)
    + blk('The full policy', `<div class="draft-banner">${ico('alert')}<span>${E(DRAFT)}</span></div><div class="prose" style="margin-top:16px">${prose}</div>`)
    + blk('Delivery questions', faqHTML(PG.faq.delivery), null, `<a class="more" href="#help">All help topics ${ico('arrow', 'sm')}</a>`)
    + `<div class="row" style="padding-bottom:48px"><a class="btn btn-primary" href="#shipping-rates">Shipping rates calculator</a><a class="btn btn-outline" href="#track">Track an order</a></div>`;
  return page([HOME, ['Shipping & delivery']], 'Shipping & delivery', pol.summary, body, `<a class="btn btn-cta" href="#shipping-rates">${ico('scale', 'sm')} Estimate my shipping</a>`);
}

/* ---------- 2. shipping rates ---------- */
let ratesSel = null;
function ratesDefaults(){
  const d = I.S.dest;
  return {seller: 'lakeview', w: 3, l: 14, wd: 10, h: 8, to: d.kind === 'intl' ? d.cc : 'US', zip: d.kind === 'us' ? d.zip : '55407'};
}
function readRates(){
  const g = id => { const e = $('#' + id); return e ? e.value : ''; };
  return {seller: g('inf-r-from'), w: num(g('inf-r-w')), l: num(g('inf-r-l')), wd: num(g('inf-r-wd')), h: num(g('inf-r-h')), to: g('inf-r-to'), zip: g('inf-r-zip').trim()};
}
function ratesView(v){
  const s = I.SELL[v.seller];
  if(!s) return '';
  if(!v.w) return `<div class="callout">${ico('info')}<span>Enter the package weight to see rates.</span></div>`;
  const raw = v.l * v.wd * v.h / 139;
  const weights = {actual: v.w, dim: Math.round(raw * 10) / 10, bill: Math.max(1, Math.ceil(Math.max(v.w, raw)))};
  let dest;
  if(v.to === 'US'){
    if(!/^\d{5}$/.test(v.zip)) return `<div class="callout">${ico('info')}<span>Enter a 5-digit US ZIP code, for example 55407.</span></div>`;
    dest = {kind: 'us', zip: v.zip, city: I.ZIPS[v.zip] || (I.isLocalZip(v.zip) ? 'Twin Cities, MN' : 'United States')};
  } else {
    dest = {kind: 'intl', cc: v.to, city: D.africa[v.to].city};
  }
  const stats = `<div class="inf-stat"><div><b>${weights.actual.toFixed(1)} lb</b><span>Actual weight</span></div><div><b>${weights.dim.toFixed(1)} lb</b><span>Dimensional weight</span></div><div class="on"><b>${weights.bill} lb</b><span>Billable weight</span></div></div>`;
  if(!I.shipsTo(s, dest)) return `${stats}<div class="callout warn" style="margin-top:14px">${ico('alert')}<span>${E(s.name)} doesn't ship to ${E(I.destLabel(dest))} yet. Pick another seller or destination.</span></div>`;
  const opts = I.quoteFor(s, weights, dest);
  const pick = opts.some(o => o.id === ratesSel) ? ratesSel : opts[0].id;
  const rows = opts.map(o => `<label class="radio-card"><input type="radio" name="inf-r-opt" value="${o.id}" data-ch="inf-r-pick"${o.id === pick ? ' checked' : ''}><span class="grow"><b>${E(o.name)}</b><small>${E(I.etaText(o))} &middot; ${E(o.by)}</small></span><span class="p">${E(fmt.usd(o.price))}</span></label>`).join('');
  const duty = dest.kind === 'intl' ? `<div class="duty">${ico('info')}<span>Orders to ${E(D.africa[dest.cc].name)} may have duties and taxes. Checkout shows an estimate before you pay.</span></div>` : '';
  return `${stats}<div class="inf-fs" role="radiogroup" aria-label="Delivery options" style="margin-top:14px">${rows}</div>${duty}<p class="small muted" style="margin-top:12px">Estimate. Final rate at checkout.</p>`;
}
function renderRates(){
  const v = ratesDefaults();
  const sellers = D.sellers.slice().sort((a, b) => a.city.localeCompare(b.city) || a.name.localeCompare(b.name));

/* ---------- 4. start a return ---------- */
const RET = {step: 1, pick: null, reason: '', note: '', method: '', err: ''};
const REASONS = ['Changed my mind', 'Wrong size or fit', 'Not what I expected', 'Ordered by mistake', 'Another reason'];
const METHODS = [
  {v: 'label', t: 'Prepaid return label from the seller', d: 'The seller sends you a label to print (to confirm). Pack the item and hand it to the carrier.'},
  {v: 'dropoff', t: 'Drop off at a UPS or FedEx location', d: 'Take the packed item to a UPS or FedEx location and keep the receipt with the tracking number.'},
  {v: 'local', t: 'iiB Local pickup', d: 'A driver collects the item. Available for Twin Cities orders.'}
];
function deliveredItems(){
  const out = [];
  I.orders().forEach((o, oi) => o.pkgs.forEach((k, pi) => {
    if(k.st !== 'Delivered') return;
    k.items.forEach((it, ii) => out.push({key: `${oi}-${pi}-${ii}`, order: o, pkg: k, item: it, p: I.PROD[it.id]}));
  }));
  return out;
}
const daysSince = d => Math.max(0, Math.round((I.TODAY - d) / 864e5));
function retStepper(n){
  const names = ['Item', 'Reason', 'Method', 'Review'];
  return `<ol class="stepper" aria-label="Return steps">${names.map((t, i) => `<li class="${i + 1 < n ? 'done' : (i + 1 === n ? 'now' : '')}"${i + 1 === n ? ' aria-current="step"' : ''}><span>${t}</span></li>`).join('')}</ol>`;
}
const retNav = (back, nextLabel, cta) => `<div class="row" style="margin-top:20px">${back ? `<button type="button" class="btn btn-outline" data-act="inf-ret-back">Back</button>` : ''}<button type="button" class="btn ${cta ? 'btn-cta' : 'btn-primary'}" data-act="${cta ? 'inf-ret-submit' : 'inf-ret-next'}">${E(nextLabel)}</button></div>`;
const retErr = () => RET.err ? `<p class="field"><span class="msg" role="alert">${ico('alert', 'sm')} ${E(RET.err)}</span></p>` : '';
function retStep1(){
  const items = deliveredItems();
  const rows = items.map(x => {
    const left = 30 - daysSince(x.pkg.eta);
    const note = left > 0 ? `${left} days left in the 30-day window (to confirm)` : 'Past the 30-day window (to confirm)';
    return `<label class="radio-card"><input type="radio" name="inf-ret-item" value="${x.key}"${RET.pick === x.key ? ' checked' : ''}><img class="inf-thumb" src="${E(I.img(x.p))}" alt=""><span class="grow"><b>${E(short(x.p.name))}</b><small>Order ${E(x.order.no)} &middot; ${E(I.SELL[x.pkg.seller].name)} &middot; Delivered ${E(fmt.md(x.pkg.eta))}<br>${E(note)}</small></span><span class="p">${E(fmt.usd(x.p.price * x.item.q))}</span></label>`;
  }).join('');
  return `<fieldset class="inf-fs"><legend><h2 tabindex="-1" style="font-size:22px">Choose the item to return</h2></legend>${rows || '<p class="muted">No delivered items yet.</p>'}</fieldset>${retErr()}${retNav(false, 'Continue')}`;
}
function retStep2(){
  const rows = REASONS.map(r => `<label class="radio-card"><input type="radio" name="inf-ret-reason" value="${E(r)}"${RET.reason === r ? ' checked' : ''}><span class="grow"><b>${E(r)}</b></span></label>`).join('');
  return `<fieldset class="inf-fs"><legend><h2 tabindex="-1" style="font-size:22px">Why are you returning it?</h2></legend>${rows}</fieldset>${field('inf-ret-note', 'Anything the seller should know', `<textarea id="inf-ret-note" rows="3">${E(RET.note)}</textarea>`, {opt: true})}<div class="callout" style="margin-top:14px">${ico('info')}<span>Item damaged, wrong or missing? <a href="#damaged">Report it instead</a>, within 7 days of delivery (to confirm).</span></div>${retErr()}${retNav(true, 'Continue')}`;
}
function retStep3(){
  const x = deliveredItems().find(i => i.key === RET.pick);
  const twin = x && ((x.order.dest.kind === 'us' && I.isLocalZip(x.order.dest.zip)) || x.pkg.local);
  const rows = METHODS.map(m => {
    const off = m.v === 'local' && !twin;
    return `<label class="radio-card"${off ? ' style="opacity:.55"' : ''}><input type="radio" name="inf-ret-method" value="${m.v}"${RET.method === m.v ? ' checked' : ''}${off ? ' disabled' : ''}><span class="grow"><b>${E(m.t)}</b><small>${E(off ? 'Only for orders delivered in the Twin Cities.' : m.d)}</small></span></label>`;
  }).join('');
  return `<fieldset class="inf-fs"><legend><h2 tabindex="-1" style="font-size:22px">How will you send it back?</h2></legend>${rows}</fieldset><div class="callout" style="margin-top:14px">${ico('info')}<span>Who pays for return shipping is to confirm.</span></div>${retErr()}${retNav(true, 'Review my return')}`;
}
function retStep4(){
  const x = deliveredItems().find(i => i.key === RET.pick);
  const m = METHODS.find(i => i.v === RET.method);
  return `<h2 tabindex="-1" style="font-size:22px;margin-bottom:14px">Check and send</h2><dl class="kv"><dt>Item</dt><dd>${E(short(x.p.name))}</dd><dt>Order</dt><dd>${E(x.order.no)}, ${E(I.SELL[x.pkg.seller].name)}</dd><dt>Reason</dt><dd>${E(RET.reason)}${RET.note ? `<br><span class="muted small">${E(RET.note)}</span>` : ''}</dd><dt>Method</dt><dd>${E(m.t)}</dd><dt>Refund</dt><dd>To your original payment method (to confirm)</dd></dl><div class="stack" style="--g:10px;margin-top:20px"><div class="row"><button type="button" class="btn btn-outline" data-act="inf-ret-back">Back</button><button type="button" class="btn btn-cta btn-lg" data-act="inf-ret-submit">Submit return request</button></div>${I.protoNote()}</div>`;
}
function retDone(){
  const x = deliveredItems().find(i => i.key === RET.pick);
  const next = ['The seller reviews your request and sends return instructions (time to confirm).', 'Send the item back and keep the return tracking number.', 'The seller checks the item, then the refund goes to your original payment method (time to confirm).'];
  return `<div class="callout ok">${ico('checkc')}<div><h2 tabindex="-1" style="font-size:22px">Return request sent</h2><p class="muted" style="margin-top:4px">Your return number is</p><div class="inf-rma">RMA-48213</div><p class="small muted" style="margin-top:4px">${E(short(x.p.name))}, order ${E(x.order.no)}. Sample number for the prototype.</p></div></div><h3 style="margin:22px 0 10px">What happens next</h3><ol class="steps" style="grid-template-columns:1fr;list-style:none;padding:0">${next.map(t => `<li class="step"><p>${E(t)}</p></li>`).join('')}</ol><div class="row" style="margin-top:20px"><a class="btn btn-primary" href="#orders">Back to my orders</a><a class="btn btn-outline" href="#home">Keep shopping</a><button type="button" class="btn btn-ghost" data-act="inf-ret-restart">Start another return</button></div>`;
}
function retHTML(){
  const body = [null, retStep1, retStep2, retStep3, retStep4, retDone][RET.step]();
  return (RET.step <= 4 ? retStepper(RET.step) : '') + body;
}
function retDraw(){
  const c = $('#inf-ret');
  if(!c) return;
  c.innerHTML = retHTML();
  const h = $('#inf-ret h2'); if(h) h.focus({preventScroll: true});
}

/* ---------- handlers ---------- */
Object.assign(window.IIB_ACTIONS, {
  'inf-tab': (a, e, group, key) => {
    $$(`[data-tabs="${group}"] button`).forEach(b => { const on = b === a; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    $$(`[id^="inf-p-${group}-"]`).forEach(p => { p.hidden = p.id !== `inf-p-${group}-${key}`; });
  },
  'inf-scroll': (a, e, id) => {
    e.preventDefault();
    const t = document.getElementById(id);
    if(!t) return;
    t.scrollIntoView({behavior: 'smooth', block: 'start'});
    t.setAttribute('tabindex', '-1');
    t.focus({preventScroll: true});
  },
  'inf-copy': () => {
    const url = location.href;
    const ok = () => I.toast(`${ico('checkc')} Link copied`);
    const fallback = () => {
      const t = document.createElement('textarea');
      t.value = url; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(t); t.select();
      let done = false;
      try{ done = document.execCommand('copy'); }catch(err){ done = false; }
      t.remove();
      done ? ok() : I.toast(`${ico('info')} Copy the link from the address bar`);
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok).catch(fallback);
    else fallback();
  },
  'inf-apply': (a, e, id) => {
    const r = PG.careers.roles[parseInt(id, 10)];
    if(!r) return;
    I.modal(`Apply: ${E(r.title)}`, formHTML('Application noted', 'This is a prototype, so nothing was sent.', applyFields(), 'Send application', {close: 1, cls: 'btn-primary'}));
  },
  'inf-again': a => {
    const box = a.closest('.callout'), f = box && box.previousElementSibling;
    if(!f) return;
    box.remove(); f.style.display = ''; f.reset();
  },
  'inf-ret-next': () => {
    retCapture();
    const need = {1: [RET.pick, 'Choose an item to continue.'], 2: [RET.reason, 'Choose a reason to continue.'], 3: [RET.method, 'Choose how you will send it back.']}[RET.step];
    if(!need[0]){ RET.err = need[1]; retDraw(); return; }
    RET.err = ''; RET.step += 1; retDraw();
  },
  'inf-ret-back': () => { retCapture(); RET.err = ''; RET.step = Math.max(1, RET.step - 1); retDraw(); },
  'inf-ret-submit': () => { RET.step = 5; retDraw(); I.toast(`${ico('checkc')} Return request sent (prototype)`); },
  'inf-ret-restart': () => { Object.assign(RET, {step: 1, pick: null, reason: '', note: '', method: '', err: ''}); retDraw(); }
});
Object.assign(window.IIB_FORMS, {
  'inf-done': f => {
    const box = document.createElement('div');
    box.className = 'callout ok'; box.setAttribute('role', 'status');
    const extra = f.dataset.close ? `<button type="button" class="btn btn-outline btn-sm" data-act="close-modal">Close</button>` : (f.dataset.again === '0' ? '' : `<button type="button" class="btn btn-outline btn-sm" data-act="inf-again">Send another</button>`);
    box.innerHTML = `${ico('checkc')}<div class="stack" style="--g:8px"><b>${E(f.dataset.title)}</b><span>${E(f.dataset.text)}</span>${extra}</div>`;
    f.style.display = 'none';
    f.after(box);
  },
  'inf-help-go': () => { const r = $('#inf-help-res'); if(r && !r.hidden) r.scrollIntoView({behavior: 'smooth', block: 'start'}); },
  'inf-nf-search': f => {
    const v = f.elements['inf-nf-q'].value.trim();
    I.S.lastQuery = v; I.S.lastDept = '';
    const q = $('#q'); if(q) q.value = v;
    I.go('search');
  }
});
Object.assign(window.IIB_INPUTS, {
  'inf-calc': el => {
    const g = k => num(($(`#inf-c-${k}`) || {}).value);
    const out = $('#inf-calc-out');
    if(out) out.innerHTML = calcOut(g('w'), g('l'), g('wd'), g('h'));
  },
  'inf-rates': el => ratesUpdate(el),
  'inf-help': el => {
    const q = el.value.trim().toLowerCase();
    const res = $('#inf-help-res'), tabs = $('#inf-help-tabs');
    if(!res || !tabs) return;
    tabs.hidden = !!q; res.hidden = !q;
    if(!q) return;
    let n = 0;
    $$('#inf-help-list details').forEach(d => { const hit = q.split(/\s+/).every(w => d.dataset.t.includes(w)); d.hidden = !hit; if(hit) n++; });
    $('#inf-help-count').textContent = n ? `${n} answer${n === 1 ? '' : 's'} found` : '';
    $('#inf-help-none').hidden = n > 0;
  }
});
Object.assign(window.IIB_CHANGES, {
  'inf-rates': el => ratesUpdate(el),
  'inf-r-pick': el => { ratesSel = el.value; },
  'inf-photos': el => {
    const list = $('#inf-photo-list');
    if(!list) return;
    const names = Array.from(el.files || []).map(f => f.name);
    list.innerHTML = names.length ? `<p class="small muted">${names.length} photo${names.length === 1 ? '' : 's'} chosen: ${E(names.join(', '))}</p>` : '';
  }
});
