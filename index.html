 goal. We do not claim that iibmarket.com fully meets WCAG 2.2 AA. A full check of the site against the guidelines is planned before launch (to confirm). We plan to update this page with what it finds."]},{"h":"Content from sellers","p":["Product photos, titles and descriptions come from independent sellers, so some may not meet the guidelines. A photo without a text description is one example. If a listing is hard to use, tell us, and we will look into it with the seller."]},{"h":"Pages run by others","p":["Some steps may use pages run by other companies, such as the payment provider's screens (to confirm) or UPS and FedEx tracking pages. We cannot change those pages ourselves, but we will pass your report on and help you finish your order another way where we can."]},{"h":"Report a barrier","p":["If any part of iiB MARKET is hard or impossible for you to use, please tell us. Email support@iibmarket.com (to confirm). Plain words are fine: you do not need to know any technical terms.","Please include the page address or product name, what you were trying to do and what went wrong. It also helps to know your device, your browser and any assistive technology you use, such as a screen reader. Screenshots help too, but you do not need to send them."]},{"h":"What happens next","p":["We will reply to confirm we got your message and tell you what we plan to do (reply time to confirm). If the barrier stops you from placing or tracking an order, we will try to help you complete it another way while we work on a fix."]},{"h":"Keeping this statement current","p":["We plan to review this statement as the site grows and after each accessibility check (to confirm). The date at the top of this page shows when it was last updated."]}]},"payment":{"title":"Payment Policy","summary":"This policy explains how paying on iiB MARKET works, from checkout to refunds. Accepted methods are shown at checkout.","sections":[{"h":"Prices and currency","p":["All prices on iiB MARKET are in US dollars (USD). Your checkout total includes the item prices and the shipping for each package, plus any sales tax that applies (to confirm). For orders to Africa, checkout also shows an estimate of import duties and taxes.","If your card or account uses another currency, your bank or payment provider may convert the amount and may charge its own fee. iiB MARKET does not set that fee and does not receive it."]},{"h":"Accepted payment methods","p":["Accepted methods are shown at checkout. The payment provider is not chosen yet (to confirm). Planned options include card payments, PayPal, Apple Pay and Google Pay (to confirm). If a method is not shown at checkout, it is not available for that order.","For some addresses in Africa, mobile money may be offered (to confirm which countries and services). For iiB Local Delivery orders in the Twin Cities area, cash on delivery may be offered (to confirm). The rules for paying the driver (to confirm) will be listed here."]},{"h":"One payment for several sellers","p":["You pay for your whole order at checkout, even when it has items from several sellers (to confirm). iiB MARKET collects the payment and pays each seller their share, minus the 10 percent marketplace commission. Each seller's package has its own shipping charge."]},{"h":"When your payment is taken","p":["The point at which your payment method is charged (to confirm) will be stated here before launch. If an item cannot be sent, for example because it is out of stock, you do not pay for it. Any amount already charged for it is refunded."]},{"h":"Keeping your payment safe","p":["Card and wallet payments are handled by the payment provider (to confirm). How card details are stored, and what iiB MARKET can see, will be described here once the provider is chosen.","Never send your card number or password in an email or a message. If someone asks for them and says they are from iiB MARKET, do not reply, and tell us at support@iibmarket.com (to confirm)."]},{"h":"Failed or declined payments","p":["If your payment fails or is declined, your order is not placed until a payment goes through. Check your card details and billing address, try another accepted method, or contact your bank.","To protect shoppers and sellers, we may hold or cancel an order if a payment looks unusual or cannot be verified. If that happens, we will contact you, and any amount charged for a canceled order is refunded."]},{"h":"Refunds","p":["Approved refunds go back to the original payment method where possible (to confirm). How long a refund takes to show depends on your bank or payment provider. Refunds for cash on delivery orders (to confirm) will be explained here.","Refunds follow the Cancellation Policy and the Returns & Refunds Policy. When you cancel a whole package before it ships, the shipping charge for that package is refunded as well (to confirm)."]},{"h":"Billing questions","p":["If a charge looks wrong or you do not recognize it, email support@iibmarket.com (to confirm) with your order number. Please contact us before you open a dispute with your bank, so we can try to fix it first."]}]},"fees":{"title":"Pricing, Taxes and Fees","summary":"This page lists what shoppers pay and what sellers pay on iiB MARKET. Prices are in US dollars, and sellers pay a 10 percent commission on each sale.","sections":[{"h":"What shoppers pay","p":["When you buy on iiB MARKET, you pay the item price set by the seller and the shipping for each package. You also pay any sales tax that applies (to confirm). For orders to Africa, import duties and taxes may also apply. Checkout shows these amounts before you pay, with duties shown as an estimate."]},{"h":"Item prices","p":["Each seller sets the price of their own products, in US dollars (USD). The price on the product page is for the item itself. Shipping and any sales tax are added at checkout.","Prices can change. The price that applies is the one shown at checkout when you place your order. If a price was clearly wrong, the seller or iiB MARKET may cancel the order and refund you."]},{"h":"Shipping costs","p":["You pay the shipping. It is calculated at checkout from your delivery address and the weight and size of each package. Orders with items from several sellers arrive as separate packages, and each package has its own shipping charge.","Big, light items can cost more to ship than you might expect, because carriers also charge for the space a box takes up. The Shipping & Delivery Policy explains how this works."]},{"h":"Sales tax","p":["Sales tax may apply to orders delivered in the United States, depending on the item and the delivery address. Who collects it, iiB MARKET or the seller, and how it appears at checkout (to confirm) will be set out here before launch."]},{"h":"Import duties and taxes","p":["Orders sent to countries in Africa, such as Kenya, Nigeria or South Africa, may have import duties and taxes set by the destination country. Checkout shows an estimate. Unless checkout says otherwise, you are responsible for these charges, which the carrier or customs may collect before delivery.","The estimate is only a guide. Customs in the destination country decides the final charge, which may be higher or lower than the estimate shown at checkout."]},{"h":"The 10 percent seller commission","p":["Sellers pay a marketplace commission of 10 percent of each sale. Shoppers do not pay this commission. For example, on a $50 sale the commission is $5, and the seller's earnings from that sale are $45.","The amount the 10 percent applies to (to confirm) will be stated here before launch. For example, it may be the item price alone, or the item price plus shipping."]},{"h":"Other seller fees","p":["No other seller fees are confirmed yet. If there are any other fees for sellers, they will be listed here before launch, with the amount and when each one applies."]},{"h":"Currency conversion fees","p":["Your card or account may use a currency other than US dollars. If so, your bank or payment provider may convert the amount and charge a fee for it. That fee is set by them, and iiB MARKET does not receive it."]}]},"seller-policy":{"title":"Seller Policy","summary":"This policy sets out the day-to-day rules for selling on iiB MARKET, from approval to shipping and returns. It works alongside the Seller Agreement and the Product Listing Standards.","sections":[{"h":"Who can sell","p":["iiB MARKET is open to independent sellers who apply and are approved. Every new seller is reviewed by hand before they can list or sell. The details and documents you need to apply (to confirm) will be listed on the seller application.","iiB MARKET decides whether to approve each application. If yours is not approved, we will tell you. Whether and when you can apply again (to confirm) will be explained in that message."]},{"h":"Your store details","p":["Keep your store name, business details, contact email and ship-from address accurate and up to date. Shoppers and iiB MARKET rely on them for orders, returns and payouts. Do not use a store name that copies another brand or could mislead shoppers."]},{"h":"What you can list","p":["List only products you have the right to sell, that you have in stock, and that follow the Product Listing Standards. Items on the prohibited list, such as weapons, cannabis, counterfeit goods and recalled products, are never allowed on iiB MARKET.","New products may be held for review before shoppers can see them. We may remove a listing, or ask you to change it, if it breaks our rules or the law in the destination."]},{"h":"Processing times","p":["You set your own processing time: the number of days you need to pack an order and hand it to the carrier or driver. Show it accurately on your listings and keep to it.","If an order will be late, tell the shopper as soon as you can. How sellers message shoppers (to confirm) will be explained before launch. Orders that ship late again and again may affect your store."]},{"h":"Packing and shipping","p":["You pack and ship every order from your own store. Pack items so they arrive safely. Make sure the packed weight and size match your listing, because the shopper's shipping charge is based on them. Add a tracking number to every package when it ships.","Nearby orders in the Twin Cities area may go by iiB Local Delivery, and farther orders go by UPS or FedEx. How shipping labels are bought, and how iiB Local Delivery collects packages from your store (to confirm), will be explained before launch."]},{"h":"Cancellations and returns","p":["Shoppers can cancel your package before it ships, so check for cancellations before you pack. How sellers are told about a cancellation (to confirm) will be explained before launch. Once a package has shipped, the shopper can ask for a return instead.","You handle returns for the items you ship. Accept returns within the window in the Returns & Refunds Policy, planned as 30 days from delivery (to confirm). Respond to reports of damaged, wrong or missing items, which shoppers send within 7 days of delivery, with photos."]},{"h":"Treating shoppers well","p":["Be polite and honest with shoppers, and answer their questions about orders and returns promptly (reply time to confirm). Do not ask shoppers to pay outside iiB MARKET, and use their details only to fill and support their orders."]},{"h":"If the rules are broken","p":["If you break this policy, the Seller Agreement or the law, we may warn you or hide or remove listings. Where the law allows, we may also hold payouts while we look into a problem, or suspend or close your store. Serious problems, such as selling stolen or counterfeit goods, may lead to immediate closure."]}]},"listing-standards":{"title":"Product Listing Standards","summary":"These standards explain how to list a product on iiB MARKET so shoppers know what they are buying and shipping is charged correctly. They also list the items you cannot sell.","sections":[{"h":"The basics","p":["Every listing must describe one real product that you have the right to sell and can ship from your own store. Set your price in US dollars. New listings may be held for review before shoppers can see them.","Listings that break these standards may be held, hidden or removed. Repeated problems may also affect your store, as set out in the Seller Policy and the Seller Agreement."]},{"h":"Titles","p":["Use a clear title that says what the item is. Include the brand, if it has one, the product type and the details shoppers look for, such as size, color, model or quantity. Keep it short and factual (maximum length to confirm).","Do not use all capital letters, emoji, prices, shipping promises or words like \"best\" or \"cheapest\" in titles. Do not add brand names that are not the product's own brand."]},{"h":"Photos","p":["Show the actual item you will ship. The main photo should be clear and well lit, on a plain background, with the whole product in view. Add more photos for other sides, details, labels and size where they help (number of photos and minimum image size to confirm).","Use only photos you have the right to use. Do not add watermarks, contact details, website links or promotional text to the main photo. Photos must match the item's color, condition and what is included."]},{"h":"Descriptions","p":["Describe the item honestly: what it is, what is included, materials, size, color and condition, plus any limits or flaws. Which item conditions are allowed (to confirm) will be listed here. For electronics, give the model, voltage and plug type, which matter for shoppers outside the United States. For food and beauty items, list the ingredients and the label's warnings.","Do not include links, phone numbers, email addresses or requests to buy outside iiB MARKET. Do not make health, safety or performance claims that you cannot back up."]},{"h":"Categories","p":["Pick the category that best fits the product, such as electronics, fashion, home, beauty, baby, grocery, sports, tools, jewelry or office. Do not place a product in an unrelated category to get more views. We may move a listing to the right category."]},{"h":"Weight and dimensions (required)","p":["Every listing must include the packed weight and the packed size of the item: length, width and height (units to confirm). Shipping is calculated from the delivery address and these numbers, so they decide what the shopper pays.","Weigh and measure the item in the box you will ship it in, and round up. If the real package is heavier or bigger than your listing says, the extra shipping cost may be charged to you (to confirm). Repeated errors may lead to listing removal.","If you sell a product in several sizes or colors, enter the weight and dimensions for each option. A larger size can change the shipping charge."]},{"h":"Prohibited items","p":["You may not list or sell these items on iiB MARKET: adult or 18+ products; cannabis and other drugs; weapons and ammunition; counterfeit or replica goods; hazardous materials; stolen goods; recalled products; and live animals. You also may not sell anything that is illegal in the place where it would be delivered.","iiB MARKET may also remove other listings that it believes are unsafe, illegal or misleading. If you are not sure whether an item is allowed, ask support@iibmarket.com (to confirm) before you list it.","Some items are legal in the United States but not in other countries. Before you list an item, check that it can legally be sent to the places you ship to. How sellers choose where they ship (to confirm) will be explained before launch."]},{"h":"Prices, stock and duplicates","p":["Show the real price you will charge, in US dollars. Keep your stock count up to date so shoppers do not buy items you cannot send. Do not raise the price after an order is placed, and do not list the same item more than once."]}]},"cancellation":{"title":"Cancellation Policy","summary":"You can cancel a seller's package until it ships. After it ships, you can return it under the Returns & Refunds Policy.","sections":[{"h":"Before your package ships","p":["You can cancel a seller's package at any time before it ships. Open the order in your account and cancel that package (to confirm). You can also email support@iibmarket.com (to confirm) with your order number and the package you want to cancel."]},{"h":"Orders with several sellers","p":["If your order has items from several sellers, each seller's items travel as a separate package. You can cancel one seller's package and keep the others. Canceling single items inside one seller's package (to confirm) will be explained here."]},{"h":"After your package ships","p":["Once a seller has shipped your package, it can no longer be canceled. Wait for it to arrive, then start a return under the Returns & Refunds Policy. Most items can be returned within 30 days of delivery (to confirm), but some items cannot be returned.","For iiB Local Delivery orders, a package counts as shipped once the driver has collected it from the seller's store (to confirm). From then on, use a return instead."]},{"h":"Your refund after a cancellation","p":["When you cancel a package before it ships, you get a refund for its items and its shipping charge (to confirm). The refund goes back to your original payment method (to confirm), and how long it takes to appear depends on your bank or payment provider. If you chose cash on delivery (to confirm), you pay nothing for a canceled package."]},{"h":"When a seller cancels","p":["A seller may cancel a package if an item is out of stock, cannot be shipped to your address, or was listed at a clearly wrong price. If that happens, you get a full refund for that package, and we will let you know by email (to confirm)."]},{"h":"When iiB MARKET cancels","p":["iiB MARKET may cancel an order or a package if the payment cannot be verified or we suspect fraud. We may also cancel it if an item breaks our Product Listing Standards or cannot legally be sent to the destination. Any amount charged for a canceled package is refunded."]},{"h":"Changing an order","p":["To change an item, size or color, cancel that seller's package before it ships and order again. To change the delivery address, contact support@iibmarket.com (to confirm) as soon as you can. Once a package has shipped, the address may not be changeable."]}]},"disclaimer":{"title":"Disclaimer","summary":"iiB MARKET is a marketplace where independent sellers list and sell their own products. This page explains the limits of the information on the site and of our responsibility.","sections":[{"h":"A marketplace of independent sellers","p":["Products on iiB MARKET are listed and sold by independent third-party sellers, who are not iiB MARKET's employees or agents (to confirm). When you buy something, you buy it from the seller (to confirm). iiB MARKET provides the marketplace, checkout and customer support."]},{"h":"Product information comes from sellers","p":["Sellers write their own titles, descriptions and photos, and set their own prices. We review new sellers by hand and ask them to follow our Product Listing Standards, but we cannot check every detail of every listing. If something looks wrong, tell us at support@iibmarket.com (to confirm).","Colors may look different on your screen, and sizes can vary by brand. Read the full listing, including the size, materials and any warnings, before you order."]},{"h":"Prices, stock and mistakes","p":["We try to keep the site accurate, but prices, stock and other details can contain mistakes or change without notice. If an item's price was clearly wrong, the seller or iiB MARKET may cancel the order and refund anything you paid for it."]},{"h":"Delivery dates and duty estimates","p":["Delivery dates shown on the site are estimates, and so are the import duty and tax amounts shown at checkout. A package can arrive later than estimated because of carrier delays, weather, customs checks or the seller's processing time. Customs in the destination country decides the final duties and taxes."]},{"h":"Product safety and use","p":["Read and follow the maker's instructions, labels and warnings for every product. Recalled products are not allowed on iiB MARKET. If you find one, or a product seems unsafe, stop using it and report it to support@iibmarket.com (to confirm).","Information on the site is general. It is not medical, legal or professional advice. For health or safety questions about a product, ask a qualified professional or the maker."]},{"h":"Links to other sites","p":["Some pages may link to sites run by others, such as UPS or FedEx tracking pages and the payment provider (to confirm). We do not control those sites and are not responsible for their content or how they handle your information. Their own terms and privacy policies apply."]},{"h":"Limits of our responsibility","p":["Where the law allows, the site and its content are provided \"as is\". iiB MARKET makes no promises beyond those in our terms and policies. Any product warranty comes from the seller or the maker (to confirm). Where the law allows, iiB MARKET is not responsible for losses caused by a seller's product or listing.","Nothing on this page takes away rights you have under consumer protection laws that cannot be limited. If anything here conflicts with the Terms & Conditions, the terms apply (to confirm)."]},{"h":"Questions","p":["If you have a question about this disclaimer or something you saw on the site, email support@iibmarket.com (to confirm). iiB MARKET is run from Minnesota, USA (full address to confirm)."]}]},"ip":{"title":"Copyright and IP Reporting","summary":"If a listing on iiB MARKET uses your copyright, trademark or other intellectual property without permission, you can report it here. A seller who thinks a report is wrong can send a counter-notice.","sections":[{"h":"What you can report","p":["You can report a listing that you believe infringes your intellectual property. For example, it may use photos or text copied from your website, sell a fake version of your branded product, or use your trademark without permission. Counterfeit and replica goods are also banned under our Product Listing Standards.","Only the rights holder, or someone authorized to act for them, can send a report. If you are a shopper and think an item is fake, tell us at support@iibmarket.com (to confirm)."]},{"h":"How to send a report","p":["Email your report to support@iibmarket.com (to confirm) and put \"IP report\" in the subject line, so we can find it quickly. A separate reporting form or address (to confirm) may be added before launch."]},{"h":"What to include","p":["Give your name, your company if you have one, and your postal address, phone number and email address. Describe the work or trademark you own, and add the registration number if there is one.","Add a link to each listing you are reporting and say what in it infringes your rights. Include a statement that you believe in good faith that the use is not authorized. Also state that the information in your report is accurate, and that you are the rights holder or are authorized to act for them.","End the report with your full name as a signature, typed or handwritten. If a report is missing something, we may ask you for more information before we act on it."]},{"h":"What happens after a report","p":["We review each complete report. If it is valid, we may remove the listing or block access to it, and we tell the seller so they can respond. Whether your contact details are shared with the seller (to confirm) will be stated here. Review times (to confirm) will be added before launch."]},{"h":"Counter-notice for sellers","p":["If your listing was removed after a report, you can send a counter-notice. Do this if you believe the removal was a mistake, or that you have the right to sell the item. Send it to support@iibmarket.com (to confirm) with your name, your contact details and a link to the listing.","Explain why you believe the report is wrong, and include a statement that the information you give is accurate. Sign it with your full name. If the counter-notice is complete, we may share it with the person who reported the listing. We may then restore the listing unless they tell us they have started legal action (timing to confirm)."]},{"h":"Repeat problems","p":["Sellers who receive repeated valid reports may have listings removed, payouts held while a case is reviewed, or their store suspended or closed, where the law allows."]},{"h":"False reports","p":["Only send a report or a counter-notice if you honestly believe it is correct. A false or misleading one can harm sellers and shoppers and may have legal consequences. We may ignore reports from people who repeatedly send false ones."]}]},"seller-agreement":{"title":"Seller Agreement","summary":"This agreement sets out the terms between you and iiB MARKET when you sell on the marketplace. It covers approval, the 10 percent commission, shipping, returns, payouts, conduct and how the agreement ends.","sections":[{"h":"Who this agreement is between","p":["This agreement is between you, the seller, and the business that runs iiB MARKET (legal name to confirm), based in Minnesota, USA (full address to confirm). It applies from the day your seller account is approved. The Seller Policy, the Product Listing Standards and the Terms & Conditions are part of it.","We may update this agreement. The date at the top shows the latest version. We will tell approved sellers about important changes before they take effect (notice period to confirm)."]},{"h":"Approval","p":["Every seller is reviewed and approved by hand before they can sell. You must give true and complete details when you apply, and keep them up to date. iiB MARKET may refuse an application, and may hold new products for review before they go live."]},{"h":"Commission and fees","p":["iiB MARKET charges a commission of 10 percent of each sale, paid by you as the seller. It is taken from the sale amount before your earnings are paid out. For example, on a $50 sale the commission is $5, and your earnings are $45.","No other seller fees are confirmed yet. Any other fees will be listed on the Pricing, Taxes and Fees page before launch. What the 10 percent applies to, for example whether shipping is included (to confirm), will be stated there too."]},{"h":"Your obligations","p":["You agree to list only items you have the right to sell, describe them honestly, follow the Product Listing Standards, and never list prohibited items. You are responsible for your products, including their safety, their labels and any warranty you offer.","You agree to follow the laws that apply to your business and products, including tax rules (to confirm who collects sales tax). Follow the rules of each place you ship to as well. Keep shoppers' details private and use them only to fill and support their orders."]},{"h":"Packing, shipping and tracking","p":["You pack and ship every order from your own store, within the processing time you set. The packed weight and size must match your listing, because the shopper's shipping charge is calculated from them and from the delivery address.","Every package must have a tracking number, added to the order when it ships. Nearby orders in the Twin Cities area may go by iiB Local Delivery, and farther orders go by UPS or FedEx. How labels are paid for and created (to confirm) will be explained before launch."]},{"h":"Cancellations and returns","p":["Shoppers can cancel your package before it ships. You handle returns for the items you ship, under the Returns & Refunds Policy. Most items can be returned within 30 days of delivery (to confirm), and some items cannot be returned.","A shopper may report a damaged, wrong or missing item within 7 days of delivery, with photos. If that happens, you must work with the shopper and iiB MARKET to put it right. Refunds for returned items may be taken from your earnings (to confirm)."]},{"h":"Payouts","p":["You receive your earnings from each sale minus the 10 percent commission. Payout timing (to confirm): the current plan is to release earnings for an order after delivery is confirmed or after the return window closes.","The payout method and schedule (to confirm) will be added here once the payment provider is chosen. iiB MARKET may hold a payout while a return, dispute or report about the order is open (to confirm)."]},{"h":"Conduct","p":["Treat shoppers, other sellers and iiB MARKET staff with respect. Do not ask shoppers to pay outside iiB MARKET, copy other sellers' listings or photos, or use the marketplace for fraud. Answer shopper questions about orders and returns promptly (reply time to confirm)."]},{"h":"Ending the agreement","p":["You can end this agreement and close your store by emailing support@iibmarket.com (to confirm). Before your store closes, ship or refund any open orders and handle returns for items you have already sold (notice period to confirm).","Where the law allows, iiB MARKET may suspend or end this agreement if you break it or the law. It may also do so if your store puts shoppers at risk. Earnings owed to you, minus refunds and commission, will be paid after open orders and returns are settled (to confirm)."]}]},"returns":{"title":"Returns & Refunds Policy","summary":"Most items on iiB MARKET can be returned within 30 days of delivery (to confirm). Each seller handles returns for the items they ship, and this page explains the steps and the timeline.","sections":[{"h":"The return window","p":["Most items can be returned within 30 days of delivery (to confirm). The 30 days start on the day your package is delivered, as shown in its tracking. Returns are handled by the seller who shipped the item."]},{"h":"Items that cannot be returned","p":["Some items cannot be returned: personal care items once opened, perishable grocery items, custom items and intimate items. The product page should say when an item cannot be returned (to confirm). If one of these items arrives damaged or wrong, see the section on damaged, wrong or missing items below."]},{"h":"How to start a return","p":["Start your return from the order page in your account (to confirm). You can also email support@iibmarket.com (to confirm) with your order number and the item you want to return. Items from different sellers are returned separately, because each seller handles returns for the items they ship.","Send the item back in the condition you received it, with its tags, parts and packaging where possible (to confirm). Use the return instructions you are given, and keep the return tracking number until your refund is issued."]},{"h":"Return shipping costs","p":["Who pays for return shipping (to confirm) will be set out here before launch. This will include the case where an item arrived damaged, wrong or not as described."]},{"h":"Damaged, wrong or missing items","p":["If an item arrives damaged, is not what you ordered, or is missing from your package, report it within 7 days of delivery. Include your order number and clear photos of the item, the packaging and the shipping label.","The seller reviews your report and offers a fix, such as a replacement or a refund (to confirm). If a whole package has not arrived, see the Shipping & Delivery Policy and contact support@iibmarket.com (to confirm)."]},{"h":"Refund timeline","p":["Step 1, request: you start a return within 30 days of delivery (to confirm). Step 2, approval: the seller reviews your request and approves it or tells you why not (time to confirm), and you get return instructions.","Step 3, item back: you send the item, and the seller checks it when it arrives (time to confirm). Step 4, refund issued: once the seller accepts the item, the refund is sent to your original payment method (time to confirm). Your bank or payment provider may need extra time to show it."]},{"h":"How refunds are paid","p":["Approved refunds go back to your original payment method (to confirm). Refunds for cash on delivery orders (to confirm) will be explained here. You get back the price of the returned item. A refund of the original shipping charge (to confirm) may depend on the reason for the return, for example a seller's mistake."]},{"h":"Several sellers and international returns","p":["If your order had items from several sellers, start a separate return for each seller's package. Each return is reviewed and refunded on its own, so refunds may arrive at different times.","Returns from addresses in Africa (to confirm) may take longer and cost more to ship. Import duties and taxes you paid may not be refundable by iiB MARKET or the seller (to confirm)."]},{"h":"If you need help with a return","p":["If a seller does not answer, or you disagree with a decision, email support@iibmarket.com (to confirm) with your order number. iiB MARKET can look into it with you and the seller."]}]},"shipping":{"title":"Shipping & Delivery Policy","summary":"Sellers ship orders from their own stores, by iiB Local Delivery in the Twin Cities area or by UPS or FedEx. You pay shipping, based on your address and each package's weight and size.","sections":[{"h":"Who ships your order","p":["Products on iiB MARKET are packed and shipped by the sellers, from their own stores. Each seller sets a processing time: the time they need to pack your order and hand it to the carrier or driver. The processing time is shown on the product page (to confirm)."]},{"h":"iiB Local Delivery in the Twin Cities","p":["For nearby orders in the Twin Cities area (Minneapolis and Saint Paul), your package may be delivered by iiB Local Delivery, iiB MARKET's own delivery fleet. The exact delivery area (to confirm) will be shown on this page before launch.","Cash on delivery may be offered for iiB Local Delivery orders (to confirm). Delivery days and hours for the local fleet (to confirm) will be listed here before launch."]},{"h":"UPS and FedEx","p":["Orders outside the local delivery area, including orders to other states and to countries in Africa, go by UPS or FedEx. Which carrier and service each package uses (to confirm) will depend on the seller, your address and the package."]},{"h":"How shipping rates are calculated","p":["You pay the shipping cost. It is calculated at checkout from your delivery address and the package's weight and size (length, width and height). Sellers must enter the weight and size of every product, so the rate is based on the real package.","Farther addresses and heavier or bigger packages usually cost more to ship. Each seller's package is priced on its own, so an order from three sellers has three shipping charges."]},{"h":"Dimensional weight, in plain words","p":["Carriers charge for the space a package takes up, as well as its weight. A large, light box, such as one with a pillow inside, can cost as much to ship as a small, heavy box of books. This is called dimensional weight.","UPS and FedEx work out a dimensional weight from the box's length, width and height. They then charge for whichever is higher: the actual weight or the dimensional weight. That is why sellers must give the packed size of each item. It is also why big, light items can cost more to ship than you might expect."]},{"h":"Processing times and delivery dates","p":["Delivery dates shown on the site are estimates. They combine the seller's processing time with the expected time in transit. Because each seller sets their own processing time, items from different sellers in one order may ship and arrive on different days.","A package can arrive later than its estimate because of weather, carrier delays, customs checks or holidays. If your package is much later than estimated, contact support@iibmarket.com (to confirm) with your order number."]},{"h":"International orders and duties","p":["iiB MARKET plans to ship to countries in Africa, such as Kenya, Somalia, Ethiopia, Nigeria, Ghana, Uganda, Tanzania and South Africa (final country list to confirm). International deliveries usually take longer and depend on the carrier and on customs in the destination country.","Import duties and taxes may apply when your package arrives. Checkout shows an estimate. Unless checkout says otherwise, you are responsible for paying them, and the carrier or customs may collect them before delivery. Customs decides the final amount.","Items that are illegal in the destination country are not allowed. An order may be canceled if an item cannot legally be delivered to your address."]},{"h":"Tracking and multiple packages","p":["Every package gets its own tracking number when it ships, and you can follow it from your order page (to confirm). If your order has items from several sellers, they arrive as separate packages, each with its own shipping charge and tracking number."]},{"h":"Delivery problems","p":["Check that your address is complete and correct before you pay, since a wrong address can delay or lose a package. If a package arrives damaged, has the wrong item or is missing items, report it within 7 days of delivery. Send photos, as the Returns & Refunds Policy explains.","If tracking shows a package as delivered but you cannot find it, check around your door and with your neighbors. Then email support@iibmarket.com (to confirm) with your order number as soon as you can."]}]}},"draft_note":"Draft for legal review. This text is a starting point for iiB MARKET's lawyer and is not legal advice.","updated":"2026-10-20"},"zips":{"55407":"Minneapolis, MN","55104":"Saint Paul, MN","60607":"Chicago, IL","30318":"Atlanta, GA","77004":"Houston, TX","10027":"New York, NY","98101":"Seattle, WA","90012":"Los Angeles, CA","55413":"Minneapolis, MN","80205":"Denver, CO","43229":"Columbus, OH","48207":"Detroit, MI"},"africa":{"KE":{"name":"Kenya","city":"Nairobi"},"SO":{"name":"Somalia","city":"Mogadishu"},"ET":{"name":"Ethiopia","city":"Addis Ababa"},"NG":{"name":"Nigeria","city":"Lagos"},"GH":{"name":"Ghana","city":"Accra"},"UG":{"name":"Uganda","city":"Kampala"}, /* ---------- shipping engine (sample model; every price says "estimate") ---------- */
const ZIPS = D.zips, AFRICA = D.africa;
const isLocalZip = z => /^55[0-5]/.test(z||'');
const zipRegion = z => parseInt((z||'5')[0],10);
const sellerRegion = s => parseInt(s.zip[0],10);
function destLabel(d=S.dest){ return d.kind==='us' ? `${d.city} ${d.zip}` : `${d.city}, ${AFRICA[d.cc].name}`; }
function destShort(d=S.dest){ return d.kind==='us' ? `${d.city.split(',')[0]} ${d.zip}` : `${d.city}, ${AFRICA[d.cc].name}`; }
function billable(items){
  let lb=0, dim=0;
  items.forEach(it => { const p=PROD[it.id]; lb += p.lb*it.q; dim += (p.dims[0]*p.dims[1]*p.dims[2]/139)*it.q; });
  return {actual: Math.round(lb*10)/10, dim: Math.round(dim*10)/10, bill: Math.max(1, Math.ceil(Math.max(lb, dim)))};
}
function shipsTo(seller, d=S.dest){ return d.kind==='us' ? seller.ships.includes('US') : seller.ships.includes('Africa'); }
function quoteFor(fromSeller, w, d){
  const s = fromSeller, out = [];
  if(d.kind==='us'){
    const near = Math.abs(sellerRegion(s) - zipRegion(d.zip));
    const factor = near===0 ? 1 : (near<=2 ? 1.25 : 1.5);
    const ground = 7.90 + 0.62*w.bill*factor;
    const gdays = factor===1 ? 2 : (factor===1.25 ? 3 : 5);
    if(s.local && isLocalZip(d.zip)){
      const early = new Date().getHours() < 14;
      out.push({id:'local', name:'iiB Local Delivery', by:'iiB fleet, live driver map', price: 4.99 + Math.max(0,w.bill-10)*0.40,
        from: early ? TODAY : addDays(TODAY,1), to: early ? TODAY : addDays(TODAY,1), window: early ? 'Today, 6 to 9 pm' : 'Tomorrow, 9 am to 1 pm', kind:'local'});
    }
    out.push({id:'ups', name:'UPS Ground', by:'UPS tracking', price: ground, from: addBiz(TODAY, gdays+1), to: addBiz(TODAY, gdays+1), kind:'us'});
    if(gdays+1 > 3) out.push({id:'fedex2', name:'FedEx 2Day', by:'FedEx tracking', price: ground*2.1, from: addBiz(TODAY, 3), to: addBiz(TODAY,3), kind:'us'});
  } else {
    out.push({id:'fedexi', name:'FedEx International Economy', by:'FedEx tracking', price: 38 + 7.40*w.bill, from: addBiz(TODAY,7), to: addBiz(TODAY,11), kind:'intl'});
    out.push({id:'upsi', name:'UPS Worldwide Expedited', by:'UPS tracking', price: 46 + 8.10*w.bill, from: addBiz(TODAY,5), to: addBiz(TODAY,8), kind:'intl'});
  }
  out.forEach(o => o.price = Math.round(o.price*100)/100);
  return out;
}
function quote(sellerId, items, d=S.dest){
  const s = SELL[sellerId]; const w = billable(items);
  if(!shipsTo(s,d)) return {weights:w, options:[], blocked:true};
  return {weights:w, options: quoteFor(s, w, d), blocked:false};
}
function dutyRate(dept, d=S.dest){ if(d.kind!=='intl') return 0; const t = D.duty[d.cc]||{}; return (t[dept] ?? t.default ?? .2); }
function etaText(o){ if(o.window) return o.window; return +o.from===+o.to ? fmt.day(o.from) : `${fmt.md(o.from)} to ${fmt.md(o.to)}`; }

/* ---------- cart helpers ---------- */
const cartCount = () => S.cart.reduce((a,b)=>a+b.q,0);
function groupBySeller(items){
  const g = {}; items.forEach(it => { const sid = PROD[it.id].seller; (g[sid] = g[sid] || []).push(it); });
  return Object.entries(g).map(([sid, list]) => ({sid, seller: SELL[sid], items:list}));
}
function cartTotals(d=S.dest){
  const pk = groupBySeller(S.cart);
  let sub=0, ship=0, duty=0, blocked=0;
  let count=0;
  pk.forEach(g => {
    g.sub = 0; g.items.forEach(it => { g.sub += PROD[it.id].price*it.q; });
    const q = quote(g.sid, g.items, d); g.q = q;
    if(q.blocked){ blocked++; return; }
    sub += g.sub; g.items.forEach(it => { const p=PROD[it.id]; duty += p.price*it.q*dutyRate(p.dept,d); count += it.q; });
    const sel = q.options.find(o=>o.id===S.shipSel[g.sid]) || q.options[0]; g.sel = sel; ship += sel.price;
  });
  const tax = d.kind==='us' ? sub*0.07375 : 0;
  return {pk, sub, ship, duty, tax, total: sub+ship+duty+tax, blocked, count};
}
function addToCart(id, q=1, opt){
  const p = PROD[id]; const s = SELL[p.seller];
  if(!shipsTo(s)){ toast(`${ico('alert')} ${esc(s.name)} doesn't ship to ${esc(destShort())} yet. <a href="#" data-act="shipto">Change address</a>`); return; }
  const ex = S.cart.find(x=>x.id===id && (x.opt||'')===(opt||''));
  if(ex) ex.q += q; else S.cart.push({id,q,opt});
  save(); updateCounts();
  toast(`${ico('checkc')} Added to cart: ${esc(p.name.split(',')[0])} <a href="#cart">View cart</a>`);
}
function toggleWish(id){
  const i = S.wish.indexOf(id); if(i>=0) S.wish.splice(i,1); else S.wish.push(id);
  save(); updateCounts();
  $$(`[data-act="wish"][data-id="${id}"]`).forEach(b => { b.classList.toggle('on', S.wish.includes(id)); b.setAttribute('aria-pressed', S.wish.includes(id)); });
  toast(S.wish.includes(id) ? `${ico('heart')} Saved to your wishlist <a href="#wishlist">View wishlist</a>` : 'Removed from your wishlist');
}
function toggleCompare(id){
  const i = S.compare.indexOf(id);
  if(i>=0) S.compare.splice(i,1); else { if(S.compare.length>=4) S.compare.shift(); S.compare.push(id); }
  save(); toast(S.compare.includes(id) ? `Added to compare (${S.compare.length} of 4) <a href="#compare">Compare now</a>` : 'Removed from compare');
}
function updateCounts(){
  $$('[data-count="cart"]').forEach(e => { const n=cartCount(); e.textContent=n; e.hidden = n===0; });
  $$('[data-count="wish"]').forEach(e => { const n=S.wish.length; e.textContent=n; e.hidden = n===0; });
}

/* ---------- toast, modal, drawer ---------- */
let toastTimer;
function toast(html){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 4200);
}
let lastFocus = null;
function modal(title, body){
  closeModal(); lastFocus = document.activeElement;
  const m = document.createElement('div'); m.className='modal-bg'; m.id='modal';
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh"><h3 id="mt">${title}</h3><button class="icon-btn" data-act="close-modal" aria-label="Close">${ico('x')}</button></div><div class="mb">${body}</div></div>`;
  document.body.appendChild(m); m.addEventListener('click', e => { if(e.target===m) closeModal(); });
  setTimeout(()=>{ const f = m.querySelector('.mb input, .mb select, .mb button, .mb a'); f && f.focus(); },30);
}
function closeModal(){ const m=$('#modal'); if(m){ m.remove(); lastFocus && lastFocus.focus && lastFocus.focus(); } }
function drawer(id, title, body, right){
  closeDrawer(); lastFocus = document.activeElement;
  const bg = document.createElement('div'); bg.className='drawer-bg'; bg.id='drawer-bg'; bg.addEventListener('click', closeDrawer);
  const d = document.createElement('aside'); d.className='drawer'+(right?' right':''); d.id='drawer'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label',title);
  d.innerHTML = `<div class="dh"><h3>${title}</h3><button class="icon-btn" data-act="close-drawer" aria-label="Close">${ico('x')}</button></div><div class="db">${body}</div>`;
  document.body.append(bg, d); setTimeout(()=>{ const f=d.querySelector('.db a, .db button'); f && f.focus(); },30);
}
function closeDrawer(){ const d=$('#drawer'); if(d){ d.remove(); $('#drawer-bg') && $('#drawer-bg').remove(); } }

const ddOpts = dd => $$('.dd-opt', dd);
function ddActive(dd, i, scroll=true){
  const opts = ddOpts(dd); if(!opts.length) return; i = Math.max(0, Math.min(opts.length-1, i));
  opts.forEach((o,j)=>o.classList.toggle('active', j===i)); $('.dd-list', dd).setAttribute('aria-activedescendant', opts[i].id);
  if(scroll) opts[i].scrollIntoView({block:'nearest'}); dd._i = i;

  dd.classList.add('open'); $('.dd-pop', dd).hidden = false; $('.dd-btn', dd).setAttribute('aria-expanded','true');

function ddClose(dd, focus){

document.addEventListener('keydown', e => {
  const dd = e.target.closest ? e.target.closest('.dd') : null; if(!dd) return;
  if(e.target.classList.contains('dd-btn')){ if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){ e.preventDefault(); ddOpen(dd); } return; }
  if(!dd.classList.contains('open')) return;
  const opts = ddOpts(dd), n = opts.length, i = dd._i || 0;
  if(e.key==='ArrowDown'){ e.preventDefault(); ddActive(dd, i+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); ddActive(dd, i-1); }
  else if(e.key==='Home'){ e.preventDefault(); ddActive(dd, 0); }
  else if(e.key==='End'){ e.preventDefault(); ddActive(dd, n-1); }
  else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); ddPick(dd, opts[i]); }
  else if(e.key==='Escape'){ e.preventDefault(); ddClose(dd, true); }
  else if(e.key==='Tab'){ ddClose(dd); }
  else if(e.key.length===1 && /\S/.test(e.key)){ const k = e.key.toLowerCase(); for(let s=1; s<=n; s++){ const j = (i+s) % n; if(opts[j].dataset.t.toLowerCase().startsWith(k)){ ddActive(dd, j); break; } } }
});

function searchProducts(q, dept){
  q = (q||'').trim().toLowerCase();
  const pool = D.products.filter(p => !dept || p.dept===dept);
  if(!q) return pool;
  const words = q.split(/\s+/).filter(Boolean);
  return pool.map(p => {
    const hay = (p.name+' '+p.sub+' '+DEPT[p.dept].name+' '+SELL[p.seller].name+' '+(p.kw||'')).toLowerCase();
    const score = words.reduce((a,w)=> a + (hay.includes(w) ? 2 : (hay.includes(w.replace(/s$/,'')) ? 1 : 0)), 0);
    return {p, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || b.p.reviews-a.p.reviews).map(x=>x.p);
}

const ROUTES = {};

const PREFIX = ['p-','c-','s-','blog-'];
function currentRoute(){

}

  const hdr = $('#hdr'); if(hdr) hdr.classList.remove('hide'); document.body.classList.remove('scroll-down');

}

    pkgs:[{seller:'amani', items:[{id:'dutchoven',q:1}], method:'iiB Local Delivery', carrier:'iiB fleet', tn:'IIBL-55407-0754', st:'Delivered', step:4, eta: rel(-8), local:true, ship:5.19, returnable:true,
      events:[[rel(-8),'Delivered','Handed to customer, photo taken'],[rel(-8),'Out for delivery','iiB hub, Minneapolis'],[rel(-9),'Picked up from seller','Amani Home & Kitchen, Saint Paul, MN']]}]};

function orderTotals(o){
  let sub=0, ship=0, duty=0;

  const tax = o.dest.kind==='us' ? sub*0.07375 : 0;
  return {sub, ship, duty, tax, total: sub+ship+duty+tax};

/* ---------- assistant (scripted) ---------- */
function aiPanel(){
  let p = $('#ai-panel'); if(p){ p.remove(); return; }
  p = document.createElement('section'); p.className='ai-panel'; p.id='ai-panel'; p.setAttribute('aria-label','iiB Assistant');
  p.innerHTML = `<div class="hd"><span class="orb" style="width:38px;height:38px;border-radius:50%;background:conic-gradient(from 210deg,var(--blue),var(--blue-500),var(--orange-bright),var(--blue));display:grid;place-items:center;flex:none"><span style="width:30px;height:30px;border-radius:50%;background:var(--navy);display:grid;place-items:center">${ico('spark','sm')}</span></span><div><b>iiB Assistant</b><small><span class="live-dot"></span> Orders, delivery, returns and selling</small></div><button class="icon-btn" data-act="ai" aria-label="Close assistant">${ico('x')}</button></div>
    <div class="msgs" id="ai-msgs" aria-live="polite"></div>
    <div class="quick-replies" id="ai-quick"></div>
    <form data-form="ai"><label class="sr" for="ai-in">Message iiB Assistant</label><input id="ai-in" placeholder="Ask about an order or delivery" autocomplete="off"><button class="btn btn-primary" aria-label="Send">${ico('send')}</button></form>`;
  document.body.appendChild(p);
  if(!S.chat.length){ aiSay(`Hi ${esc(S.user.first)}, I'm the iiB Assistant. I can check your orders, estimate delivery to any address and start a return. What do you need?<p class="proto-note" style="margin-top:8px">${ico('info')}<span>Prototype: scripted answers. The live assistant will read real orders and tracking.</span></p>`, true); }
  else { $('#ai-msgs').innerHTML = S.chat.map(m=>`<div class="msg ${m.who}">${m.html}</div>`).join(''); }
  aiQuick(); setTimeout(()=>{ const i=$('#ai-in'); i && i.focus(); },40);
}
function aiQuick(list){ const q = $('#ai-quick'); if(!q) return; list = list || ['Where is my order?','Shipping to Nairobi','Start a return','Sell on iiB MARKET','Talk to a person']; q.innerHTML = list.map(t=>`<button type="button" data-act="ai-q" data-v="${esc(t)}">${esc(t)}</button>`).join(''); }
function aiSay(html, bot){ S.chat.push({who: bot?'bot':'me', html}); const m = $('#ai-msgs'); if(!m) return; const d = document.createElement('div'); d.className='msg '+(bot?'bot':'me'); d.innerHTML = html; m.appendChild(d); m.scrollTop = m.scrollHeight; }
function aiAsk(text){
  aiSay(esc(text), false);
  const m = $('#ai-msgs'); const t = document.createElement('div'); t.className='msg bot'; t.innerHTML='<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>'; m.appendChild(t); m.scrollTop=m.scrollHeight;
  setTimeout(()=>{ t.remove(); aiSay(aiReply(text), true); }, 650);
}
function aiReply(text){
  const q = text.toLowerCase(); const o = orders()[0];
  if(/mogadishu|somalia/.test(q)){ const d={kind:'intl',cc:'SO',city:'Mogadishu'}; const p=PROD.shea; const op=quote(p.seller,[{id:p.id,q:1}],d).options[0];
    return `Somalia is on the delivery list. Example: <b>${esc(p.name)}</b> to Mogadishu by ${esc(op.name)}: <b>${fmt.usd(op.price)}</b>, ${esc(etaText(op))}, plus an estimated ${fmt.usd(p.price*dutyRate(p.dept,d))} in duties. <a href="#" data-act="shipto">Change your address</a>`; }
  if(/minneapolis|55407|local|today|same day/.test(q)){ return `In the Twin Cities, sellers with local stock deliver by <b>iiB Local Delivery</b>, often the same day, with a live map of the driver. Other sellers ship by UPS or FedEx. <a href="#shipping">How delivery works</a>`; }
  if(/calculat|weight|size|dimension|how much/.test(q)){ return `Shipping is priced from where the seller ships, your address, and the package's weight and size. A big but light box uses its dimensional weight (length x width x height / 139). <a href="#blog-how-shipping-cost-is-calculated">Read the guide</a> or <a href="#shipping-rates">try the calculator</a>.`; }
  if(/where|track|order|package|status/.test(q)){
    aiQuick(['Shipping to Nairobi','Change delivery address','Talk to a person']);
    return `Your latest order <b>${o.no}</b> has ${o.pkgs.length} packages:<div class="mini">${o.pkgs.map(k=>`<div class="pk"><span>${esc(SELL[k.seller].name)}<br><small class="muted">${esc(k.method)}</small></span><span class="status ${k.st==='Delivered'?'st-ok':k.st==='Out for delivery'?'st-warn':'st-info'}">${esc(k.st)}</span></div>`).join('')}</div><div style="margin-top:10px"><a class="btn btn-primary btn-sm" href="#track">Open tracking</a></div>`;
  }
  if(/nairobi|kenya|africa|ship|deliver|cost|dut/.test(q)){
    const d = {kind:'intl', cc:'KE', city:'Nairobi'}; const p = PROD.headphones; const qt = quote(p.seller,[{id:p.id,q:1}], d); const best = qt.options[0];
    aiQuick(['Shipping to Mogadishu','How is shipping calculated?','Shipping to Minneapolis 55407']);
    return `Example: the <b>${esc(p.name.split(',')[0])}</b> to Nairobi, Kenya (billable weight ${qt.weights.bill} lb):<div class="mini"><div class="pk"><span>${esc(best.name)}<br><small class="muted">${esc(etaText(best))}</small></span><b>${fmt.usd(best.price)}</b></div><div class="pk"><span>Estimated duties and taxes<br><small class="muted">sample rate</small></span><b>${fmt.usd(p.price*dutyRate(p.dept,d))}</b></div></div><div style="margin-top:10px"><a class="btn btn-outline btn-sm" href="#shipping-rates">Open the rate calculator</a></div>`;
  }
  if(/return|refund|damaged|broken|wrong|missing/.test(q)){ aiQuick(['Item arrived damaged','Talk to a person','Where is my order?']); return `You can start a return from your orders. Most items can be returned within 30 days of delivery (draft policy, to confirm). Damaged, wrong or missing items: tell us within 7 days, with photos.<div style="margin-top:10px" class="row" style="--g:6px"><a class="btn btn-primary btn-sm" href="#start-return">Start a return</a><a class="btn btn-ghost btn-sm" href="#damaged">Damaged or missing</a></div>`; }
  if(/sell|seller|store|vendor|commission/.test(q)){ return `To sell on iiB MARKET: apply, we review your store by hand, then you list products and ship orders from your own store. The commission is <b>10% of each sale</b>.<div style="margin-top:10px"><a class="btn btn-cta btn-sm" href="#sell">See how selling works</a></div>`; }
  if(/person|human|agent|support|help/.test(q)){ return `I'll pass this to the support team. They reply by email from support@iibmarket.com (to confirm). <a href="#support-request">Open a support request</a>`; }
  aiQuick(); return `I can help with orders, delivery costs, returns and selling. Pick one of the options below.`;
}

  'set-zip':(a,e,id,v)=> setDest({kind:'us', zip:v, city:ZIPS[v]}),

  'close-modal':()=> closeModal(),
  'close-drawer':()=> closeDrawer(),

  'mega-dept':(a,e,id,v)=>{ const m=$('#mega'); m.dataset.active=v; m.innerHTML = megaHTML(v); const b=m.querySelector(`[data-v="${v}"]`); b && b.focus(); },
  menu:()=> drawer('menu','Menu', `<div class="stack" style="--g:4px"><a class="pn-link" href="#account" data-act="close-drawer-nav"><span class="row" style="--g:10px">${ico('user')} Account & Orders</span></a><a class="pn-link" href="#track" data-act="close-drawer-nav"><span class="row" style="--g:10px">${ico('pkg')} Track Order</span></a><a class="pn-link" href="#deals" data-act="close-drawer-nav"><span class="row" style="--g:10px">${ico('bolt')} Today's Deals</span></a><a class="pn-link" href="#sell" data-act="close-drawer-nav"><span class="row" style="--g:10px">${ico('store')} Sell on iiB MARKET</span></a><a class="pn-link" href="#help" data-act="close-drawer-nav"><span class="row" style="--g:10px">${ico('help')} Help Center</span></a></div><div class="pn-sec"><h4>Departments</h4>${D.departments.map(d=>`<a class="pn-link" href="#c-${d.key}" data-act="close-drawer-nav"><span class="row" style="--g:10px"><img src="${dimg(d.key)}" alt="" style="width:36px;height:36px;border-radius:8px">${esc(d.name)}</span>${ico('right','sm')}</a>`).join('')}</div>`),

};

  quote,quoteFor,billable,shipsTo,dutyRate,etaText,isLocalZip,destLabel,destShort,ZIPS,AFRICA,cartCount,groupBySeller,cartTotals,addToCart,toggleWish,toggleCompare,updateCounts,
  ddHTML,ddClose,stars,lettermark,priceHTML,routeHTML,deliveryLine,pcard,scard,crumbs,protoNote,sampleTag,sec,more,toast,modal,closeModal,drawer,closeDrawer,shipToModal,setDest,
  searchProducts,route,ROUTES,currentRoute,render,go,orders,orderTotals,aiPanel,aiAsk};

window.IIB_BOOT = function(){
  $('#shell-top').innerHTML = headerHTML();
  $('#shell-foot').innerHTML = footerHTML();
  document.body.insertAdjacentHTML('beforeend', fabsHTML());
  window.addEventListener('hashchange', () => render());
  let lastY = scrollY;
  addEventListener('scroll', () => {
    const y = scrollY, h = $('#hdr'); if(!h) return;
    if(innerWidth > 860 || document.activeElement === $('#q') || $('.dd.open') || !$('#sugg').hidden){ h.classList.remove('hide'); document.body.classList.remove('scroll-down'); lastY = y; return; }
    if(y > lastY + 6 && y > 240) h.classList.add('hide'); else if(y < lastY - 6 || y < 140) h.classList.remove('hide');

    document.body.classList.toggle('scroll-down', h.classList.contains('hide') && !$('#ai-panel'));

  }, {passive:true});
  const syncFooter = () => { const mob = innerWidth <= 560; if(syncFooter.m === mob) return; syncFooter.m = mob; $$('.ftr .fcol').forEach(d => { d.open = !mob; d.querySelector('summary').tabIndex = mob ? 0 : -1; }); };

  ph(); addEventListener('resize', ph);
  render(); cookieBanner();
};
})();

<script>
/* iiB MARKET prototype: shopping pages (home, listings, product, cart, checkout, confirmation, wishlist, compare, deals, gift cards). */
(function(){

const I = window.IIB, D = I.D, S = I.S, esc = I.esc, fmt = I.fmt, ico = I.ico, $ = I.$, $$ = I.$$;
const P = I.PROD, SL = I.SELL, DP = I.DEPT;

/* ---------- home ---------- */

  {img:'img/hero/hero-tech.webp', m:'img/hero/hero-tech-m.webp', alt:'Headphones, a canvas sneaker, a smartwatch and a perfume oil bottle on navy podiums', cta:{t:"Shop Today's Deals", h:'#deals'}, k:"Today's deals", a:'Your marketplace.', b:'More choices.', lede:'Shop thousands of products from approved sellers. See the shipping cost before you pay, and track every package to your door.'},

function slideCopy(x, live){

const PRICE = [['u25','Under $25',0,25],['25-50','$25 to $50',25,50],['50-100','$50 to $100',50,100],['100-250','$100 to $250',100,250],['250','$250 and up',250,1e9]];
let F = {};
function resetFilters(fixed){ F = Object.assign({dept:[], price:null, r4:false, sellers:[], africa:false, local:false, deal:false, sub:null, sort:'featured', view:'grid', shown:24}, fixed||{}); }
function applyFilters(base){
  const pr = F.price ? PRICE.find(x=>x[0]===F.price) : null;
  let list = base.filter(p => (!F.dept.length || F.dept.includes(p.dept)) && (!F.sub || p.sub===F.sub)
    && (!pr || (p.price>=pr[2] && p.price<pr[3])) && (!F.r4 || p.rating>=4.5) && (!F.sellers.length || F.sellers.includes(p.seller))
    && (!F.africa || SL[p.seller].ships.includes('Africa')) && (!F.local || SL[p.seller].local) && (!F.deal || p.was));
  const s = F.sort;
  if(s==='low') list.sort((a,b)=>a.price-b.price); else if(s==='high') list.sort((a,b)=>b.price-a.price);
  else if(s==='rating') list.sort((a,b)=>b.rating-a.rating || b.reviews-a.reviews); else if(s==='new') list.sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0));
  else if(s==='popular') list.sort((a,b)=>b.reviews-a.reviews);
  return list;
}

    <div class="fgroup"><h4>Seller</h4>${sellers.map(s=>cb('f-seller', s.id, F.sellers.includes(s.id), esc(s.name), count(p=>p.seller===s.id))).join('')}</div>

    ${list.length > F.shown ? `<div class="pager"><button data-act="f-more" style="padding:0 18px">Show ${Math.min(24, list.length-F.shown)} more of ${list.length}</button></div>` : ''}`;
